<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Council of AI — AG-UI (one dashboard, every measured surface)</title>
<meta name="description" content="One unified AG-UI dashboard: estate board, model catalog, arena Elo, benchmark-quality register, regulatory deadline, orbital AI, corrections, verify. Every surface rendered as a component. Measurement, not certification.">
<style>
:root {
  --bg:#0b0f14; --panel:#10161d; --card:#151d26; --line:#23303d; --line2:#2e3e4f;
  --text:#e8edf2; --muted:#9fb0c0; --faint:#6a7a8a;
  --accent:#5a9; --accent2:#7cc7a1; --gold:#fc6; --red:#e66; --green:#8c6;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
}
* { box-sizing:border-box; }
body { margin:0; font-family:-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--text); line-height:1.55; font-size:14px; }
a { color:var(--accent2); text-decoration:none; }
.app { display:flex; flex-direction:column; min-height:100vh; }
/* top SaaS nav bar */
.topbar { display:flex; align-items:center; justify-content:space-between; gap:1rem; padding:.55rem 1.2rem; background:var(--panel); border-bottom:1px solid var(--line); }
.topbar .brand { display:flex; align-items:center; gap:.55rem; font-weight:700; font-size:.95rem; white-space:nowrap; }
.topbar .brand .pulse { width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent);animation:pul 2.4s ease-in-out infinite; }
.topbar .brand small { color:var(--faint); font-weight:400; font-size:.66rem; margin-left:.2rem; }
.tb-tabs { display:flex; gap:.25rem; flex-wrap:wrap; }
.tb-ctrl { display:flex; gap:.3rem; flex-wrap:wrap; }
.pane-btn { background:transparent; color:var(--muted); border:1px solid var(--line); padding:.32rem .6rem; border-radius:8px; cursor:pointer; font-size:.68rem; }
.pane-btn:hover { border-color:var(--accent); color:var(--text); }
.pill { padding:.2rem .5rem; border-radius:999px; border:1px solid var(--line); white-space:nowrap; }
.shell.rail-off .side { display:none; } .shell.rail-off { grid-template-columns:1fr; }
.shell.min { display:none; }
.tb-tab { background:transparent; color:var(--muted); border:0; padding:.45rem .85rem; border-radius:8px; cursor:pointer; font-size:.85rem; }
.tb-tab:hover { background:var(--card); color:var(--text); }
.tb-tab.active { background:#1a2830; color:var(--accent2); font-weight:600; }
.shell { display:grid; grid-template-columns:220px 1fr; flex:1; min-height:0; }
@media (max-width:800px){ .shell{grid-template-columns:1fr;} .side{border-right:0;border-bottom:1px solid var(--line);} .topbar{flex-wrap:wrap;} .tb-tabs{width:100%;} }

/* sidebar */
.side { background:var(--panel); border-right:1px solid var(--line); padding:1rem .8rem; position:sticky; top:0; height:100vh; overflow-y:auto; }
.brand { display:flex; align-items:center; gap:.5rem; padding:.4rem .5rem .9rem; border-bottom:1px solid var(--line); margin-bottom:.6rem; }
.brand .pulse { width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent);animation:pul 2.4s ease-in-out infinite; }
@keyframes pul { 0%,100%{opacity:1;} 50%{opacity:.35;} }
.brand b { font-size:.92rem; } .brand span { font-size:.62rem; color:var(--faint); display:block; }
.nav { display:flex; flex-direction:column; gap:2px; }
.navbutton { text-align:left; background:transparent; color:var(--muted); border:0; padding:.55rem .6rem; border-radius:8px; cursor:pointer; font-size:.85rem; display:flex; align-items:center; gap:.5rem; width:100%; }
.navbutton:hover { background:var(--card); color:var(--text); }
.navbutton.active { background:#1a2830; color:var(--accent2); }
.navbutton .ico { width:16px; text-align:center; font-size:.8rem; }
.side-foot { margin-top:1rem; padding:.6rem .5rem; border-top:1px solid var(--line); font-size:.62rem; color:var(--faint); line-height:1.5; }

/* main */
.main { padding:1.4rem 1.6rem; overflow-x:hidden; }
.head { display:flex; justify-content:space-between; align-items:flex-start; gap:1rem; flex-wrap:wrap; margin-bottom:1.2rem; }
.head h1 { margin:0; font-size:1.3rem; }
.head .sub { color:var(--muted); font-size:.85rem; margin-top:.3rem; max-width:70ch; }
.info { font-size:.74rem; color:var(--faint); font-family:var(--mono); }

/* panels */
.panel { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:1rem 1.1rem; margin-bottom:1rem; }
.panel h2 { margin:0 0 .6rem; font-size:1rem; }
.panel .desc { color:var(--muted); font-size:.82rem; margin-bottom:.8rem; }
.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:.8rem; }
.card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:.8rem .9rem; }
.card .k { font-size:.62rem; color:var(--faint); text-transform:uppercase; letter-spacing:.08em; }
.card .v { font-size:1.3rem; font-weight:800; color:var(--accent2); font-variant-numeric:tabular-nums; }
.card .s { font-size:.7rem; color:var(--muted); font-family:var(--mono); margin-top:.2rem; }
.card.lead { border-color:var(--accent); background:linear-gradient(135deg,#121a22,#0f151b); }
.card .rank { font-size:.6rem; color:var(--gold); text-transform:uppercase; letter-spacing:.1em; }

/* OpenRouter-style model cards */
.mcard { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:.9rem .9rem 1rem; display:flex; flex-direction:column; gap:.5rem; }
.mcard:hover { border-color:var(--accent); }
.mcard .mhead { display:flex; align-items:center; justify-content:space-between; gap:.5rem; }
.mcard .mname { font-weight:700; font-size:.9rem; }
.mcard .mvin { font-size:.66rem; color:var(--faint); font-family:var(--mono); }
.mcard .mbadge { font-size:.6rem; color:var(--accent2); border:1px solid var(--line); padding:.1rem .5rem; border-radius:999px; white-space:nowrap; }
.mcard .mscore { font-size:1.9rem; font-weight:800; color:var(--accent2); font-variant-numeric:tabular-nums; line-height:1; }
.mcard .mscore small { font-size:.7rem; color:var(--faint); font-weight:400; }
.mcard .maxis { display:flex; flex-direction:column; gap:.28rem; }
.mcard .maxis .axrow { display:flex; align-items:center; gap:.5rem; font-size:.68rem; color:var(--muted); }
.mcard .maxis .axbar { flex:1; height:6px; border-radius:3px; background:#1a212a; overflow:hidden; }
.mcard .maxis .axbar i { display:block; height:100%; background:var(--accent); }
.mcard .mfoot { font-size:.62rem; color:var(--faint); font-family:var(--mono); margin-top:auto; }

/* workspace agent tools */
.toolchips { display:flex; flex-wrap:wrap; gap:.45rem; padding:.65rem .8rem; border-top:1px solid var(--line); background:#0c1116; }
.tool { font-size:.72rem; color:var(--text); border:1px solid var(--line); background:var(--card); padding:.35rem .7rem; border-radius:999px; cursor:pointer; }
.tool:hover { border-color:var(--accent); color:var(--accent2); }
.ws-status { font-size:.66rem; color:var(--faint); font-family:var(--mono); padding:.4rem .8rem; }
/* model library (OpenRouter rail) */
.ml { border-bottom:1px solid var(--line); padding:.1rem .2rem .6rem; margin-bottom:.6rem; }
.ml-lbl { font-size:.6rem; color:var(--faint); text-transform:uppercase; letter-spacing:.08em; padding:.3rem .3rem .3rem; }
.ml-q { width:100%; background:#12181f; color:var(--text); border:1px solid var(--line); border-radius:8px; padding:.4rem .6rem; font-size:.74rem; outline:none; }
.ml-q:focus { border-color:var(--accent); }
.ml-list { max-height:150px; overflow-y:auto; margin-top:.4rem; display:flex; flex-direction:column; gap:2px; }
.ml-item { text-align:left; background:transparent; color:var(--muted); border:0; padding:.32rem .4rem; border-radius:6px; cursor:pointer; font-size:.72rem; font-family:var(--mono); }
.ml-item:hover { background:var(--card); color:var(--text); }
/* MCP tool-card grid (centre = tooling cards + chat) */
.mcpgrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:.5rem; padding:.7rem .8rem; border-top:1px solid var(--line); background:#0c1116; }
.mcpcard { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:.55rem .6rem; cursor:pointer; }
.mcpcard:hover { border-color:var(--accent); transform:translateY(-1px); }
.mcpcard .mc-ico { font-size:1rem; }
.mcpcard .mc-t { font-size:.72rem; font-weight:600; margin-top:.2rem; }
.mcpcard .mc-d { font-size:.62rem; color:var(--faint); font-family:var(--mono); }

/* regulator hub: cards + hot cards + crosswalk */
.regcard { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:.85rem .9rem; cursor:pointer; display:flex; flex-direction:column; gap:.4rem; }
.regcard:hover { border-color:var(--accent); transform:translateY(-2px); }
.regcard .reg-t { font-weight:700; font-size:.86rem; }
.regcard .reg-i { font-size:.66rem; color:var(--faint); font-family:var(--mono); }
.regcard .reg-meta { display:flex; gap:.4rem; flex-wrap:wrap; }
.regcard .reg-p { font-size:.62rem; color:var(--muted); margin-top:auto; }
.hotcard { background:linear-gradient(135deg,#121a22,#0f151b); border:1px solid var(--accent); border-radius:12px; padding:.9rem 1rem; }
.hotcard .k { font-size:.62rem; color:var(--faint); text-transform:uppercase; letter-spacing:.08em; }
.hotcard .v { font-size:1.15rem; font-weight:800; color:var(--accent2); margin:.3rem 0 .2rem; line-height:1.3; }
.hotcard .s { font-size:.66rem; color:var(--muted); }
.xwrow { display:flex; align-items:center; justify-content:space-between; gap:.6rem; padding:.5rem .3rem; border-bottom:1px solid var(--line); font-size:.78rem; }
.xwrow:last-child { border-bottom:0; }
.xwrow[data-jump] { cursor:pointer; }
.xwrow[data-jump]:hover { background:#141b23; }
.xwrow .badge { font-size:.6rem; color:var(--gold); border:1px solid var(--line); padding:.1rem .5rem; border-radius:999px; }
.regws { border:1px solid var(--line); border-radius:12px; background:var(--panel); overflow:hidden; }
.regws .rwlog { max-height:280px; overflow-y:auto; padding:.8rem; display:flex; flex-direction:column; gap:.5rem; }
.regws .rwlog .cmsg { max-width:90%; }

table { width:100%; border-collapse:collapse; font-size:.8rem; }
th,td { border-bottom:1px solid var(--line); padding:.4rem .5rem; text-align:left; }
th { color:var(--muted); font-weight:600; font-size:.7rem; text-transform:uppercase; letter-spacing:.05em; }
tr:hover td { background:#141b23; }
th.axis-col { writing-mode:vertical-rl; font-size:.58rem; white-space:nowrap; }
.bar { display:inline-block; height:7px; border-radius:4px; background:var(--accent); vertical-align:middle; }
.gold { color:var(--gold); } .acc { color:var(--accent2); } .unm { color:var(--faint); }
code { background:#1a212a; padding:.05rem .3rem; border-radius:4px; font-size:.78em; font-family:var(--mono); }

/* chat */
.chat { display:flex; flex-direction:column; height:calc(100vh - 180px); min-height:420px; border:1px solid var(--line); border-radius:12px; background:var(--panel); overflow:hidden; }
.chatlog { flex:1; overflow-y:auto; padding:1rem; display:flex; flex-direction:column; gap:.6rem; }
.cmsg { max-width:80%; padding:.6rem .8rem; border-radius:10px; font-size:.84rem; white-space:pre-wrap; }
.cmsg.user { align-self:flex-end; background:#1c2833; border:1px solid var(--line2); }
.cmsg.bot { align-self:flex-start; background:var(--card); border:1px solid var(--line); }
.cmsg .lbl { font-size:.6rem; color:var(--faint); text-transform:uppercase; letter-spacing:.07em; margin-bottom:.2rem; }
.cinput { display:flex; gap:.5rem; padding:.8rem; border-top:1px solid var(--line); background:#0e141a; }
.cinput input { flex:1; background:#12181f; color:var(--text); border:1px solid var(--line); border-radius:999px; padding:.6rem .9rem; font-size:.85rem; outline:none; }
.cinput input:focus { border-color:var(--accent); }
.cinput button { background:var(--accent); color:#062; font-weight:700; border:0; border-radius:999px; padding:.6rem 1.1rem; cursor:pointer; }
.chips { display:flex; flex-wrap:wrap; gap:.4rem; padding:.6rem .8rem; border-top:1px solid var(--line); background:#0c1116; }
.chip { font-size:.68rem; color:var(--accent2); border:1px solid var(--line); background:var(--card); padding:.25rem .6rem; border-radius:999px; cursor:pointer; }
.chip:hover { border-color:var(--accent); }

/* workspace harness dock (mini, always-on in the sidebar) */
.ws { margin-top:.9rem; border-top:1px solid var(--line); padding:.6rem .2rem .2rem; }
.ws-lbl { font-size:.6rem; color:var(--faint); text-transform:uppercase; letter-spacing:.08em; margin-bottom:.4rem; }
.ws-log { display:flex; flex-direction:column; gap:.4rem; margin-bottom:.5rem; max-height:180px; overflow-y:auto; }
.ws-msg { font-size:.72rem; padding:.4rem .55rem; border-radius:8px; white-space:pre-wrap; word-break:break-word; }
.ws-msg.you { align-self:flex-end; background:#1c2833; border:1px solid var(--line2); color:var(--muted); }
.ws-msg.harness { align-self:flex-start; background:var(--card); border:1px solid var(--line); color:var(--text); }
.ws-input { display:flex; gap:.4rem; }
.ws-input input { flex:1; background:#12181f; color:var(--text); border:1px solid var(--line); border-radius:8px; padding:.4rem .6rem; font-size:.74rem; outline:none; }
.ws-input input:focus { border-color:var(--accent); }
.ws-input button { background:var(--accent); color:#062; font-weight:700; border:0; border-radius:8px; padding:.4rem .7rem; cursor:pointer; font-size:.74rem; }
.ws-hint { font-size:.6rem; color:var(--faint); margin-top:.4rem; line-height:1.4; }

.tabs { display:flex; gap:.4rem; margin-bottom:1rem; flex-wrap:wrap; }
.tab { font-size:.78rem; color:var(--muted); border:1px solid var(--line); background:var(--card); padding:.4rem .9rem; border-radius:999px; cursor:pointer; }
.tab.active { color:var(--accent2); border-color:var(--accent); }
.loading { color:var(--faint); font-size:.85rem; }
.tag { font-size:.6rem; color:var(--accent2); border:1px solid var(--line); padding:.1rem .45rem; border-radius:999px; }
.doctrine { border-left:3px solid var(--accent); background:#121a22; padding:.7rem .9rem; border-radius:0 8px 8px 0; font-size:.8rem; color:var(--muted); margin-bottom:1rem; }
</style>
<script src="estate-data.js"></script>
</head>

// ---------- VERIFY ----------
function renderVerify(el){
  stamp('verify a signed record · free, loginless');
  el.innerHTML = '<div class="doctrine">Paste a signed record JSON (with content_id, signature, pubkey, body) OR a raw content_id / signature / pubkey. We recompute content_id (RFC 8785) and check the Ed25519 signature.</div>'+
    '<div class="panel"><textarea id="vinp" style="width:100%;min-height:160px;background:#10141a;color:#e8edf2;border:1px solid var(--line);border-radius:10px;padding:1rem;font-family:var(--mono);font-size:.82rem;resize:vertical" placeholder=\'{"body":{...},"content_id":"...","signature":"...","pubkey":"..."}\'></textarea>'+
    '<button class="chip" id="vgo" style="margin-top:.6rem;font-size:.8rem">Verify</button><div id="vres" style="margin-top:.8rem;font-family:var(--mono);font-size:.82rem;white-space:pre-wrap"></div></div>';
  $('vgo').onclick = function(){
    var raw = $('vinp').value.trim(); var res = $('vres');
    if (!raw){ res.innerHTML = '<span class="gold">paste a record</span>'; return; }
    var payload; try { payload = JSON.parse(raw); } catch(e){ res.innerHTML = '<span class="gold">could not parse JSON</span>'; return; }
    var body = {};
    for (var k in payload){ if(!['content_id','signature','pubkey'].includes(k)) body[k]=payload[k]; }
    fetch('/api/verify',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({content_id:payload.content_id,signature:payload.signature,pubkey:payload.pubkey,...body})})
      .then(r=>r.json()).then(function(d){
        res.innerHTML = d.valid ? '<span class="acc">✓ VALID</span> — content_id_match: '+d.content_id_match+' · signature_valid: '+d.signature_valid+'<br>not_a_certification: true · endorsement: none' : '<span class="gold">✗ INVALID — '+esc(d.error||'mismatch')+'</span>';
      }).catch(function(e){ res.innerHTML = '<span class="gold">error: '+esc(e)+'</span>'; });
  };
}

// ---------- WORKSPACE (AG-UI harness — agent tools + streaming reveal) ----------
var WORKSPACE_TOOLS = [
  ['board','tool=board','▦ estate board'],
  ['arena','tool=arena','⚔ arena Elo'],
  ['evidence','tool=evidence','🗂 evidence'],
  ['regulation','tool=regulation','⏱ regulation'],
  ['corrections','tool=corrections','📝 corrections'],
  ['agents','tool=agents','🤖 agents'],
  ['fleet','tool=fleet','🛰 fleet'],
  ['status','tool=status','⛑ system status'],
  ['instruments','/api/instruments','🗂 instruments'],
  ['route','/api/route?uri=eunomia://regulation/REG-001','🧭 route eunomia'],
  ['chain','/api/chain','🔗 ledger'],
  ['sovsign','/api/signal?axis=gov&jurisdiction=EU','📈 SOV signal'],
  ['sovidx','/api/sov-signal','📊 SOV index'],
  ['measure','tool=mcp&op=measure&model=nemotron-3-nano:30b','⚗ measure a model'],
  ['mcptools','tool=mcp&op=tools','⚙ mcp tools'],
  ['verify','nav:verify','🔑 verify'],
];
function renderChat(el){
  stamp('deterministic enforced-escort brain · no model in the path');
  el.innerHTML = '<div class="doctrine">Workspace. Agent tools run over the signed corpus + GSPC MCP — no LLM judge, no model in the path. Ask free-form or fire a tool.</div>'+
    '<div class="mcpgrid">'+WORKSPACE_TOOLS.map(function(t){ return '<div class="mcpcard" data-url="'+esc(t[1])+'" title="'+esc(t[0])+'"><div class="mc-ico">'+esc(t[2].charAt(0))+'</div><div class="mc-t">'+esc(t[2].slice(1))+'</div><div class="mc-d">'+esc(t[0])+'</div></div>'; }).join('')+'</div>'+
    '<div class="chat"><div class="chatlog" id="chlog"></div>'+
    '<div class="toolchips">'+WORKSPACE_TOOLS.map(function(t){return '<button class="tool" data-url="'+t[1]+'">'+t[2]+'</button>';}).join('')+'</div>'+
    '<div class="cinput"><input id="cinp" placeholder="ask the workspace… (e.g. estate board leader, model catalog, verify a card)"><button id="csend">→</button></div></div>';
  var log = $('chlog'), busy = false;
  function add(txt,who){ var d=document.createElement('div'); d.className='cmsg '+(who==='user'?'user':'bot'); d.innerHTML='<div class="lbl">'+(who==='user'?'you':'harness')+'</div>'+esc(txt); log.appendChild(d); log.scrollTop=log.scrollHeight; return d; }
  function reveal(node,txt){ // progressive token reveal (streaming feel, no backend SSE needed)
    node.innerHTML='<div class="lbl">harness</div><span></span>';
    var span=node.querySelector('span'); var i=0, step=Math.max(3,Math.floor(txt.length/220));
    var iv=setInterval(function(){
      i+=step; span.textContent=txt.slice(0,i); node.scrollTop=node.scrollHeight;
      if(i>=txt.length){ clearInterval(iv); span.textContent=txt; node.scrollTop=node.scrollHeight; }
    },16);
  }
  function fmt(d,url){
    if(d.message) return d.message;
    if(d.summary) return d.summary;
    if(d.error) return '→ '+d.error;
    if(d.mode==='mcp-measure') return 'signed measurement card · not_a_certification: '+(d.signed_card?String(d.signed_card).slice(0,90):'no card');
    if(d.mode==='mcp-tools') return 'GSPC MCP tools: '+((d.tools||[]).map(function(t){return t.name;}).join(', ')||'none');
    if(d.mode==='mcp-verify') return 'verified: '+(d.verdict||d.error||'check /api/verify');
    if(d.mode==='status') return (d.line||'')+(d.can_do?('\n'+d.can_do.map(function(x){return '• '+x;}).join('\n')):'')+(d.framing?('\n'+d.framing):'');
    if(d.mode==='board') return 'Estate board: '+d.measured_cells+' measured cells · leader '+(d.leader||'?');
    if(d.mode==='arena') return 'Arena: '+d.count+' rounds';
    if(d.mode==='evidence') return 'Evidence reports: '+(d.reports||[]).length+' agents';
    if(d.mode==='regulation') return 'Regulation: '+(d.count||d.records||[])+' regimes · '+d.upcoming+' upcoming';
    if(d.mode==='corrections') return 'Corrections: '+(d.open)+' open of '+(d.total||'?');
    if(d.mode==='agents') return 'Agents: '+(d.agents||[]).length+' in snapshot';
    if(d.mode==='fleet') return 'Fleet: '+((d.fleet&&d.fleet.status)||JSON.stringify(d.fleet||{}).slice(0,120));
    if(d.mode) return d.mode+' · '+JSON.stringify(d).slice(0,220);
    return JSON.stringify(d).slice(0,260);
  }
  function ask(q){
    if(busy) return; busy=true; add(q,'user'); var d=add('…','bot');
    fetch('/api/hero?q='+encodeURIComponent(q)).then(function(r){return r.json();}).then(function(dd){ busy=false; reveal(d,fmt(dd)); })
      .catch(function(e){ busy=false; d.innerHTML='<div class="lbl">harness</div><span>harness offline</span>'; });
  }
  function run(url){
    if(busy) return; busy=true; var d=add('running '+(url.split('&')[0].split('=').pop())+'…','bot');
    var target = (url.indexOf('/')===0) ? url : '/api/hero?'+url;   // absolute endpoints pass through
    fetch(target).then(function(r){return r.json();}).then(function(dd){ busy=false; reveal(d,fmt(dd)); })
      .catch(function(e){ busy=false; d.innerHTML='<div class="lbl">harness</div><span>tool error</span>'; });
  }
  $('csend').onclick=function(){ var q=$('cinp').value.trim(); if(q){ ask(q); $('cinp').value=''; } };
  $('cinp').onkeydown=function(e){ if(e.key==='Enter'){ var q=$('cinp').value.trim(); if(q){ ask(q); $('cinp').value=''; } } };
  document.querySelectorAll('.tool[data-url]').forEach(function(c){ c.onclick=function(){ var u=c.dataset.url; if(u.indexOf('nav:')===0){ show(u.slice(4)); } else { run(u); } }; });
  var cardrun = function(u){ if(u.indexOf('nav:')===0){ show(u.slice(4)); } else { run(u); } };
  document.querySelectorAll('.mcpcard[data-url]').forEach(function(c){ c.onclick=function(){ cardrun(c.dataset.url); }; });
  // drive the MCP card grid from the same WORKSPACE_TOOLS (already rendered inline in renderChat)
  add('Workspace ready. Ask free-form, or fire an agent tool. Measurement, not certification.','bot');
}

function buildTopbar(){

  PAGES.forEach(function(p){

    b.onclick = function(){ show(p.id); };
    host.appendChild(b);
  });
}
function setTopActive(id){
  document.querySelectorAll('.tb-tab').forEach(function(t){ t.classList.toggle('active', t.dataset.section===id); });
}

// ---------- WORKSPACE HARNESS DOCK (mini AG-UI, always on) ----------
function addWsMsg(who, txt){
  var d=document.createElement('div'); d.className='ws-msg '+who; d.textContent=txt;
  var log=$('wslog'); log.appendChild(d); log.scrollTop=log.scrollHeight;
}
function wsAsk(){
  var q=$('wsq').value.trim(); if(!q) return;
  addWsMsg('you', q); $('wsq').value=''; addWsMsg('harness','…');
  var log=$('wslog');
  fetch('/api/hero?q='+encodeURIComponent(q)).then(function(r){return r.json();}).then(function(d){
    var m=d.message||d.framing||((d.mode?d.mode+' · ':'')+((d.top&&d.top[0])?d.top[0].model+' '+d.top[0].avg:''));
    var last=log.lastElementChild; if(last&&last.textContent==='…')last.remove();
    addWsMsg('harness', String(m));
  }).catch(function(){ var last=log.lastElementChild; if(last&&last.textContent==='…')last.remove(); addWsMsg('harness','harness offline — check /api/health'); });
}
function wsAsk_init(){
  var go=$('wsgo'), q=$('wsq');
  go.onclick=wsAsk;
  q.onkeydown=function(e){ if(e.key==='Enter'){ e.preventDefault(); wsAsk(); } };
  addWsMsg('harness','Tap the harness. Ask me anything measured — measurement, not certification.');
}

buildNav();
buildTopbar();
show('chat');   // Council OS lands the centre on the AG-UI workspace (agent panel + tooling)
renderWsDock(); // persistent agent panel docked under every page (Cursor-style)
renderMlLib();  // OpenRouter-style model library in the rail
wsAsk_init();
function checkHealth(){ fetch('/api/health').then(function(r){return r.json();}).then(function(){ var p=$('livepill'); if(p){ p.textContent='live'; p.style.color='var(--green)'; } }).catch(function(){ var p=$('livepill'); if(p){ p.textContent='offline · embedded data'; p.style.color='var(--gold)'; } }); }
checkHealth();
// pane controls (Cursor-style: rail + agent panel)
(function(){
  var shell = document.querySelector('.shell');
  var pb = { hide: $('pb-hide'), rail: $('pb-rail'), restore: $('pb-restore'), min: $('pb-min'), close: $('pb-close') };
  if (pb.hide) pb.hide.onclick = function(){ shell.classList.add('rail-off'); };
  if (pb.rail) pb.rail.onclick = function(){ shell.classList.remove('rail-off'); };
  if (pb.restore) pb.restore.onclick = function(){ shell.classList.remove('rail-off'); shell.classList.remove('min'); };
  if (pb.min) pb.min.onclick = function(){ shell.classList.add('min'); };
  if (pb.close) pb.close.onclick = function(){ document.querySelector('.app').style.display = 'none'; };
})();
