<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>▶ 90-Second Demo — Sovereign AI OS · Cesium 3D Globe</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,system-ui,monospace;background:#02060f;color:#e5e5e5;line-height:1.6;height:100vh;overflow:hidden}
  .container{display:grid;grid-template-columns:1fr 350px;height:100vh;gap:0}
  .stage{position:relative;background:radial-gradient(ellipse at center,#0a0e27 0%,#000 100%);overflow:hidden}
  .stage .scanline{position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,#10b981,transparent);animation:scan 2s linear infinite;z-index:10}
  @keyframes scan{0%{top:0;opacity:1}100%{top:100%;opacity:0}}
  .stage .label{position:absolute;color:#fbbf24;font-size:.7rem;background:rgba(0,0,0,0.85);padding:.3rem .5rem;border-radius:4px;z-index:5;pointer-events:none;transform:translate(-50%,0);white-space:nowrap;border:1px solid #fbbf24}
  .stage .pulse{position:absolute;width:18px;height:18px;border-radius:50%;background:#fbbf24;box-shadow:0 0 30px #fbbf24;transform:translate(-50%,-50%);animation:pulse 1.5s ease-in-out infinite;z-index:4}
  @keyframes pulse{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.6)}}
  .stage .ring{position:absolute;border:2px solid #fbbf24;border-radius:50%;transform:translate(-50%,-50%);opacity:0.4;z-index:3;pointer-events:none;animation:ring-expand 4s linear infinite}
  @keyframes ring-expand{0%{transform:translate(-50%,-50%) scale(0.3);opacity:0.8}100%{transform:translate(-50%,-50%) scale(3);opacity:0}}
  .stage .hive-dot{position:absolute;width:6px;height:6px;border-radius:50%;background:#60a5fa;box-shadow:0 0 6px #60a5fa;transform:translate(-50%,-50%);z-index:4;cursor:pointer;transition:all .2s}
  .stage .hive-dot:hover{transform:translate(-50%,-50%) scale(2);background:#fbbf24}
  .stage .hive-dot.t1{background:#fbbf24;box-shadow:0 0 10px #fbbf24;width:8px;height:8px}
  .stage .hive-dot.t2{background:#f59e0b;box-shadow:0 0 8px #f59e0b;width:7px;height:7px}
  .stage .stage-label{position:absolute;top:1rem;left:1rem;background:rgba(2,6,15,0.85);padding:.7rem 1rem;border-radius:6px;border-left:3px solid #fbbf24;z-index:10;max-width:280px}
  .stage .stage-label .title{color:#fbbf24;font-size:.85rem;font-weight:bold;margin-bottom:.3rem}
  .stage .stage-label .desc{color:#aaa;font-size:.7rem;line-height:1.4}
  .stage .progress-bar{position:absolute;bottom:1rem;left:1rem;right:1rem;height:6px;background:rgba(0,0,0,0.5);border-radius:3px;overflow:hidden;z-index:10}
  .stage .progress-bar .fill{height:100%;background:linear-gradient(90deg,#10b981,#fbbf24);width:0%;transition:width 0.5s}
  .stage .saas-window{position:absolute;background:linear-gradient(135deg,rgba(2,6,15,0.95) 0%,rgba(26,31,58,0.95) 100%);border:1px solid #fbbf24;border-radius:8px;padding:0.7rem;min-width:220px;max-width:260px;z-index:20;box-shadow:0 0 20px rgba(251,191,36,0.3);transition:all 0.3s}
  .saas-window .title{color:#fbbf24;font-size:.7rem;font-weight:bold;margin-bottom:.3rem}
  .saas-window .body{color:#aaa;font-size:.65rem;line-height:1.4}
  .chat-ui{background:#0a0a0a;border-left:1px solid #333;display:flex;flex-direction:column;height:100vh;overflow:hidden}
  .chat-header{background:rgba(2,6,15,0.95);padding:0.7rem 1rem;border-bottom:1px solid #fbbf24;display:flex;align-items:center;gap:.5rem;flex-shrink:0}
  .chat-header .title{color:#fbbf24;font-size:.9rem;font-weight:bold}
  .chat-header .status{color:#10b981;font-size:.7rem;font-family:monospace;margin-left:auto}
  .chat-header .status .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#10b981;margin-right:.3rem;animation:pulse 1.5s infinite}
  .chat-messages{flex:1;overflow-y:auto;padding:0.7rem;display:flex;flex-direction:column;gap:.5rem}
  .msg{padding:.5rem 0.7rem;border-radius:6px;max-width:90%;font-size:.75rem;line-height:1.4;animation:slidein 0.3s}
  @keyframes slidein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  .msg.ai{background:rgba(251,191,36,0.1);border-left:3px solid #fbbf24;align-self:flex-start;color:#e5e5e5}
  .msg.user{background:rgba(96,165,250,0.1);border-left:3px solid #60a5fa;align-self:flex-end;color:#e5e5e5}
  .msg .label{color:#fbbf24;font-size:.65rem;font-weight:bold;margin-bottom:.2rem}
  .msg.user .label{color:#60a5fa}
  .chat-input{padding:0.7rem;border-top:1px solid #333;display:flex;gap:.5rem;align-items:center;flex-shrink:0}
  .chat-input input{flex:1;padding:.5rem 0.7rem;background:#02060f;border:1px solid #333;border-radius:4px;color:#fbbf24;font-family:monospace;font-size:.75rem}
  .chat-input button{background:#fbbf24;color:#000;padding:.5rem 0.8rem;border:none;border-radius:4px;font-weight:bold;cursor:pointer;font-size:.7rem;font-family:inherit}
  .start-overlay{position:absolute;inset:0;background:rgba(2,6,15,0.95);display:flex;align-items:center;justify-content:center;flex-direction:column;z-index:100;backdrop-filter:blur(8px)}
  .start-overlay h1{color:#fbbf24;font-size:2.2rem;margin-bottom:1rem;text-shadow:0 0 30px #fbbf24}
  .start-overlay p{color:#aaa;font-size:.9rem;margin-bottom:1rem;max-width:500px;text-align:center;line-height:1.5}
  .start-overlay .start-btn{background:#10b981;color:#000;padding:.8rem 1.5rem;border:none;border-radius:6px;font-weight:bold;cursor:pointer;font-size:1rem;font-family:inherit;margin-top:1rem}
</style>
</head>
<body>

<div class="container">
  <div class="stage" id="stage">
    <div class="scanline"></div>

    <div class="stage-label" id="stageLabel">
      <div class="title" id="stageTitle">🐉 Sovereign AI OS — 90-Second Demo</div>
      <div class="desc" id="stageDesc">SOV33 scans your IP, maps your local hive, shows the sovereign world. Auto-playing.</div>
    </div>

    <div class="progress-bar"><div class="fill" id="progressFill"></div></div>

    <div class="start-overlay" id="startOverlay">
      <h1>▶ 90-Second Demo</h1>
      <p>Auto-playing demonstration of the sovereign AI OS.</p>
      <p style="color:#10b981;font-size:.85rem">IP scan · 10-mile local · 30-mile regional · 33-hive global</p>
      <button class="start-btn" onclick="startDemo()">▶ Start Demo</button>
    </div>
  </div>

  <div class="chat-ui">
    <div class="chat-header">
      <span style="color:#fbbf24;font-size:1.1rem">🐉</span>
      <span class="title">SOV33 Demo</span>
      <span class="status"><span class="dot"></span>live</span>
    </div>
    <div class="chat-messages" id="chatMessages"></div>
    <div class="chat-input">
      <input type="text" id="chatInput" placeholder="Ask during demo..." onkeypress="if(event.key==='Enter')sendChat()">
      <button onclick="sendChat()">Send</button>
    </div>
  </div>
</div>

<script>
let demoStep = 0;
let demoStartTime = 0;

const STEPS = [
  {duration: 5000, title: "🐉 Demo start", desc: "SOV33 sovereign guide loading."},
  {duration: 12000, title: "🌐 IP Geo-Locate", desc: "SOV33 scanning IP 82.45.123.67 → London, UK → nearest hive: London"},
  {duration: 18000, title: "🔍 10-Mile Local Scan", desc: "All sovereign layers active. Care Floor 0.95, BFT 12-around-1, SIGIL chain, Mamba-2 SSD, Sovereign Composite 7.305, DORADO 1-click, Fork Doctrine, 22 Hieroglyphs, Public Watchdog, JARVIS, DEFONEOS, Crown Lineage."},
  {duration: 18000, title: "🌍 30-Mile Regional", desc: "12 sovereign queens. BFT 12-around-1. Watchdog signals. 100+ data feeds."},
  {duration: 18000, title: "🛰️ Global View (33 hive planets)", desc: "33 hive planets orbit the CSOAI sun. The sovereign world."},
  {duration: 19000, title: "🎉 Demo complete", desc: "Welcome to the sovereign age. Click 'Full Tour' for the 6-min experience."},
];

function log(msg, type = "ai") {
  const chat = document.getElementById("chatMessages");
  const div = document.createElement("div");
  div.className = "msg " + type;
  const label = type === "ai" ? "SOV33" : "You";
  div.innerHTML = `<div class="label">${label}</div>${msg}`;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function speak(text) {
  if (!('speechSynthesis' in window)) return;
  const u = new SpeechSynthesisUtterance(text);
  u.rate = 1.05;
  u.pitch = 1.0;
  window.speechSynthesis.speak(u);
}

function sendChat() {
  const input = document.getElementById("chatInput");
  const text = input.value.trim();
  if (!text) return;
  log(text, "user");
  input.value = "";
  setTimeout(() => {
    const lower = text.toLowerCase();
    if (lower.includes("composite")) log("Sovereign composite 7.305. Trending to 10.0. The 6 primitives combined.", "ai");
    else if (lower.includes("care")) log("Care Floor 0.95. 16 probes. Defensive only. Never Offend.", "ai");
    else if (lower.includes("bft") || lower.includes("council")) log("BFT 12-around-1. 12 sovereign queens.", "ai");
    else if (lower.includes("crown")) log("Crown lineage 1795-2026. UK 16939677. CSOAI Ltd.", "ai");
    else log("Welcome to the sovereign age. The dragon ships.", "ai");
    speak(document.querySelector(".msg.ai:last-child .label + *")?.textContent || "Sovereign");
  }, 400);
}

function setStage(title, desc) {
  document.getElementById("stageTitle").textContent = title;
  document.getElementById("stageDesc").textContent = desc;
}

function latLngToXY(lat, lng) {
  return {
    x: (lng + 180) / 360 * 100,
    y: (90 - lat) / 180 * 100,
  };
}

const HIVES = [
  {name:"London",lat:51.5,lng:-0.1,tier:"t1"},
  {name:"Tokyo",lat:35.7,lng:139.7,tier:"t3"},
  {name:"New York",lat:40.7,lng:-74.0,tier:"t3"},
  {name:"Sydney",lat:-33.9,lng:151.2,tier:"t3"},
  {name:"Cape Town",lat:-33.9,lng:18.4,tier:"t4"},
  {name:"Dubai",lat:25.2,lng:55.3,tier:"t3"},
  {name:"Sao Paulo",lat:-23.6,lng:-46.6,tier:"t3"},
  {name:"Mumbai",lat:19.1,lng:72.9,tier:"t3"},
];

function renderHives() {
  HIVES.forEach(h => {
    const {x, y} = latLngToXY(h.lat, h.lng);
    const dot = document.createElement("div");
    dot.className = "hive-dot " + h.tier;
    dot.style.left = x + "%";
    dot.style.top = y + "%";
    document.getElementById("stage").appendChild(dot);
    const lbl = document.createElement("div");
    lbl.className = "label";
    lbl.textContent = h.name;
    lbl.style.left = x + "%";
    lbl.style.top = (y + 4) + "%";
    document.getElementById("stage").appendChild(lbl);
  });
}

function addPulse(x, y) {
  const pulse = document.createElement("div");
  pulse.className = "pulse";
  pulse.style.left = x + "%";
  pulse.style.top = y + "%";
  document.getElementById("stage").appendChild(pulse);
  for (let i = 0; i < 3; i++) {
    const ring = document.createElement("div");
    ring.className = "ring";
    ring.style.left = x + "%";
    ring.style.top = y + "%";
    document.getElementById("stage").appendChild(ring);
  }
}

function addSaaSWindow(title, body, x, y) {
  const win = document.createElement("div");
  win.className = "saas-window";
  win.style.right = (x || 280) + "px";
  win.style.top = (y || 80) + "px";
  win.innerHTML = `<div class="title">${title}</div><div class="body">${body}</div>`;
  document.getElementById("stage").appendChild(win);
}

async function startDemo() {
  document.getElementById("startOverlay").style.display = "none";
  demoStartTime = Date.now();
  log("▶ 90-second demo starting. Welcome to the sovereign AI OS.", "ai");
  speak("90 second demo. The dragon sovereigns the world.");

  // Render hives
  renderHives();

  // Add initial SaaS windows
  addSaaSWindow("🔏 SIGIL", "Last SIGIL: 4bebc076a9<br>ed25519 · chain 1240", 280, 60);
  addSaaSWindow("❤️ Care Floor", "0.95 ✓<br>16 probes passing", 280, 220);

  for (let i = 0; i < STEPS.length; i++) {
    demoStep = i;
    const step = STEPS[i];
    setStage(step.title, step.desc);
    log("▓▒░ " + step.title + ": " + step.desc, "ai");
    speak(step.title.replace(/[^a-zA-Z0-9\s:]/g, ''));

    // Add pulses at appropriate steps
    if (i === 1) {
      // IP detected - pulse on London
      const {x, y} = latLngToXY(51.5, -0.1);
      addPulse(x, y);
    } else if (i === 4) {
      // Global - add pulse on multiple hives
      HIVES.forEach(h => {
        const {x, y} = latLngToXY(h.lat, h.lng);
        addPulse(x, y);
      });
    }

    const progress = ((i + 1) / STEPS.length) * 100;
    document.getElementById("progressFill").style.width = progress + "%";

    await new Promise(r => setTimeout(r, step.duration));
  }

  log("🎉 Demo complete. Try the 6-min full tour for the full experience.", "ai");
  speak("Demo complete. Welcome to the sovereign age.");
}

// Initial log
log("🐉 Hello. I'm SOV33, sovereign guide. Press 'Start Demo' for the 90-second tour.", "ai");
</script>

</body>
</html>
