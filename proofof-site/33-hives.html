function renderHives(filter) {
  const grid = document.getElementById("hive-grid");
  let filtered = HIVES;
  if (filter !== "all") {
    filtered = HIVES.filter(h => h.tier === filter || h.general === filter);
  }
  grid.innerHTML = filtered.map(h => `
    <div class="hive ${h.tier}" data-tier="${h.tier}" data-general="${h.general}">
      <h3>#${h.id} ${h.name}</h3>
      <p><span class="tier ${h.tier}">${h.tier}</span> · <span class="general">${h.general}</span></p>
      <p class="coords">${h.lat_lng} · ${h.region}</p>
      <p class="sigil">sigil: hive-${h.id.toString().padStart(2, '0')}-${h.name.toLowerCase()}-${h.general.toLowerCase()}</p>
    </div>
  `).join("");
}

function filter(t) {
  currentFilter = t;
  document.querySelectorAll(".filter button").forEach(b => b.classList.remove("active"));
  event.target.classList.add("active");
  renderHives(t);
}

function filterDragon() { currentFilter = "Dragon"; document.querySelectorAll(".filter button").forEach(b => b.classList.remove("active")); renderHives("Dragon"); }
