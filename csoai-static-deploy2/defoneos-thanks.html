<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank You — DEFONEOS</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui,sans-serif;background:radial-gradient(ellipse at 50% 30%,#0a0a2e,#000 80%);color:#f8fafc;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem}
.container{text-align:center;max-width:600px}
h1{font-size:3rem;background:linear-gradient(135deg,#22c55e,#22d3ee);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:1rem}
.icon{font-size:5rem;display:block;margin-bottom:1rem}
p{color:#94a3b8;font-size:1.1rem;margin:.5rem 0}
.ref{background:rgba(34,211,238,.08);border:1px solid rgba(34,211,238,.2);border-radius:12px;padding:1rem;margin:1.5rem 0}
.ref code{color:#22d3ee;font-size:1.2rem;font-weight:bold}
.next{margin-top:2rem}
.next a{display:inline-block;margin:.3rem;padding:.8rem 2rem;border-radius:10px;text-decoration:none;font-weight:bold}
.btn-primary{background:linear-gradient(135deg,#22d3ee,#8b5cf6);color:#000}
.btn-secondary{background:transparent;border:2px solid rgba(34,211,238,.3);color:#22d3ee}</style>
</head>
<body>
<div class="container">
<span class="icon">🐉</span>
<h1>Thank You!</h1>
<p id="message">Your request has been received. Our team will contact you shortly.</p>
<div class="ref"><p style="color:#64748b;font-size:.85rem">Your reference number:</p><code id="ref">DFN-XXX-XXXXXX</code></div>
<div class="next">
<a href="/" class="btn-primary">🌍 Return to Globe</a>
<a href="/defoneos-academy" class="btn-secondary">🎓 Explore Academy</a>
</div>
<p style="margin-top:2rem;color:#64748b;font-size:.8rem">DEFONEOS · CSOAI Ltd · UK Companies House 16939677</p>
</div>
<script>
var params=new URLSearchParams(window.location.search);
var ref=params.get('ref');var type=params.get('type');var session=params.get('session_id');
if(ref)document.getElementById('ref').textContent=ref;
if(type==='investor')document.getElementById('message').textContent='Nick Templeman will personally reach out within 48 hours with the pitch deck.';
if(type==='waitlist')document.getElementById('message').textContent='You are on the list! You will be among the first to get access.';
if(session)document.getElementById('message').textContent='Payment successful! Your DEFONEOS subscription is now active. Check your email for onboarding instructions.';
</script>
</body></html>
