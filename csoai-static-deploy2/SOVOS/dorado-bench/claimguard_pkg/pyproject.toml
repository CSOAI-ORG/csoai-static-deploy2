[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "csoai-claimguard"
version = "0.1.0"
description = "ClaimGuard — the receipt for your claims. Claim-vs-signed-artifact integrity checker."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "CC-BY-4.0"}
authors = [{name = "CSOAI Ltd", email = "info@csoai.org"}]
dependencies = ["cryptography>=42"]

[project.scripts]
claimguard = "csoai_claimguard.cli:main"

[tool.setuptools]
packages = ["csoai_claimguard"]
