# Lightning AI Studio Config — SOV33 Sovereign AI Training
# Generated by free_gpu/setup_lightning.py on 2026-07-27 02:54 UTC
# Deploy: lightning run app free_gpu/lightning_studio.yaml
# Docs:   https://lightning.ai/docs/studio/overview

# ── Studio Metadata ─────────────────────────────────────────────────
name: sov33-lightning-train
display_name: "SOV33 Sovereign AI Training on T4"
description: >
  LoRA fine-tuning of sov5v2 on free T4 GPU.
  Benchmarks capability domains, trains on weak areas,
  saves checkpoints to S3, syncs results to GitHub.

# ── Compute ─────────────────────────────────────────────────────────
compute:
  gpu: T4
  gpu_count: 1
  cpu: 4
  memory: 32
  max_runtime_hours: 22  # monthly free tier limit

# ── Environment ─────────────────────────────────────────────────────
build:
  python_version: "3.11"
  requirements:
    - torch>=2.4.0
    - torchvision
    - torchaudio
    - transformers>=4.45.0
    - datasets>=2.21.0
    - accelerate>=0.34.0
    - peft>=0.12.0
    - trl>=0.9.0
    - bitsandbytes>=0.43.0
    - huggingface_hub>=0.25.0
    - sentencepiece
    - protobuf
    - scipy
    - numpy
    - tqdm
    - wandb
    - boto3           # S3 checkpoint sync
    - pyyaml
    - psutil

  # System dependencies for bitsandbytes
  system:
    - build-essential
    - curl
    - git
    - unzip

# ── Startup ─────────────────────────────────────────────────────────
startup:
  clone_repo: https://github.com/CSOAI-ORG/sov5v2
  clone_dest: /workspace/sov33
  post_clone:
    - pip install -e /workspace/sov33 2>/dev/null || true
    - mkdir -p /workspace/sov33/checkpoints /workspace/sov33/benchmark-results
    - echo "SOV33 Lightning Studio ready — $(date -u '+%Y-%m-%d %H:%M UTC')"

# ── Secrets (set via 'lightning secrets set NAME=VALUE') ────────────
env:
  HF_TOKEN: ${HF_TOKEN}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
  S3_BUCKET: ${S3_BUCKET:-sov33-checkpoints}
  GH_TOKEN: ${GH_TOKEN}
  WANDB_API_KEY: ${WANDB_API_KEY}
  TRAIN: ${TRAIN:-true}

# ── Entry Point ─────────────────────────────────────────────────────
entrypoint: python /workspace/sov33/free_gpu/lightning_train.py
