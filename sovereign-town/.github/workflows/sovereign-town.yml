name: Sovereign Town p0_aqua

on:
  push:
    branches: [main]
    paths:
      - "p0_aqua/**"
      - "proofof-site/**"
      - ".github/workflows/sovereign-town.yml"
  pull_request:
    paths:
      - "p0_aqua/**"
      - "proofof-site/**"
      - ".github/workflows/sovereign-town.yml"

jobs:
  lint:
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: p0_aqua
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy type check
        continue-on-error: true
        run: mypy --ignore-missing-imports --no-namespace-packages .

  unit-and-http:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: p0_aqua
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start background services
        run: |
          python -m benchmark serve --port 3941 &
          python -m benchmark mcp --transport sse --port 3942 &
          python dashboard_server.py &
          for url in http://127.0.0.1:3940/api/health http://127.0.0.1:3941/harness/health; do
            for i in {1..30}; do
              curl -s -o /dev/null -w "%{http_code}" "$url" | grep -q "200" && break
              sleep 1
            done
          done
          # Wait for MCP SSE to begin emitting events.
          for i in {1..30}; do
            timeout 3 bash -c 'curl -s http://127.0.0.1:3942/mcp/sse | head -1' | grep -q "event: endpoint" && break
            sleep 1
          done
          # Final deep readiness gate.
          for i in {1..30}; do
            curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3940/api/ready | grep -q "200" && break
            sleep 1
          done

      - name: Run selftest
        run: python selftest.py

      - name: Run e2e tests
        run: python e2e_test.py

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('p0_aqua/requirements.txt') }}

      - name: Install Playwright browsers
        run: python -m playwright install chromium

      - name: Run browser tests
        run: python -m pytest browser_test.py -v

      - name: Stop background services
        if: always()
        run: pkill -f "benchmark serve" || true; pkill -f "benchmark mcp" || true; pkill -f "dashboard_server.py" || true



  static-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: proofof-site
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check static internal links
        run: python3 scripts/check-links.py

  deploy-proofof:
    runs-on: ubuntu-latest
    needs: [unit-and-http, static-checks]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && secrets.VERCEL_TOKEN != ''
    defaults:
      run:
        working-directory: proofof-site
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: ./scripts/deploy.sh --prod
