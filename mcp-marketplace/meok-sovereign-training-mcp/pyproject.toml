[project]
name = "meok-sovereign-training-mcp"
version = "1.0.0"
description = "Sovereign Training + Certification MCP - free training across 33 industries (one course per hive). W3C Verifiable Credentials, auto-grading, sovereign badges. All free. EU AI Act, DORA, HIPAA, JSP 936, SOC 2 + 28 more."
requires-python = ">=3.10"
dependencies = []
authors = [
    {name = "CSOAI Ltd (UK 16939677)", email = "nicholas@csoai.org"},
]
license = {text = "MIT"}

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]