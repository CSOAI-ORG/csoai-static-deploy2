[project]
name = "meok-sovereign-iot-stream-mcp"
version = "1.0.0"
description = "Sovereign IoT Stream MCP - real-time 9-sensor iOK Farm WebSocket-style stream. 16-probe Care Floor alerts."
requires-python = ">=3.10"
dependencies = []
authors = [{name = "CSOAI Ltd (UK 16939677)", email = "nicholas@csoai.org"}]
license = {text = "MIT"}

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
