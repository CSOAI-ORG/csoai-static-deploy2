[project]
name = "meok-sovereign-owem-mcp"
version = "1.0.0"
description = "Sovereign OWEM MCP — wraps the 6 sectors × 4 axes × 3 depths OWEM specialist matrix as MCP tools. End-users install in ChatGPT/Claude/Cursor/Copilot/Gemini to compose specialists and clans inside their chat."
requires-python = ">=3.10"
dependencies = []
authors = [{name = "CSOAI Ltd (UK 16939677)", email = "nicholas@csoai.org"}]
license = {text = "MIT"}

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["meok_sovereign_owem_mcp*"]
