[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meok-sovereign-os-mcp"
version = "1.0.0"
description = "Sovereign AI OS surface MCP — 6 tools to introspect csoai.org from any AI platform"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Nicholas Templeman", email = "nicholas.templeman@csoai.org" }]
keywords = ["mcp", "sovereign", "os", "csoai", "council-of-ai", "introspection"]

[project.urls]
Homepage = "https://csoai.org"
Source = "https://github.com/CSOAI-ORG/clawd-workspace/tree/main/mcp-marketplace/meok-sovereign-os-mcp"

[tool.setuptools.packages.find]
where = ["."]
include = ["meok_sovereign_os_mcp*"]