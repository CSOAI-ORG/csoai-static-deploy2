[project]
name = "meok-sovereign-os-mcp"
version = "1.0.0"
description = "Sovereign OS MCP — the 'show me everything' wrapper. 7 tools: render_5_worlds, render_33_clans, get_signed_state, explain_world, list_clans, arena_summary, install_for_platform. The single MCP end-users install to get the full sovereign substrate (OOWM/OWEM/IWM/OWM/VWM + 33 clans + live arena) inside their AI platform."
requires-python = ">=3.10"
dependencies = []
authors = [{name = "CSOAI Ltd (UK 16939677)", email = "nicholas@csoai.org"}]
license = {text = "MIT"}

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["meok_sovereign_os_mcp*"]
