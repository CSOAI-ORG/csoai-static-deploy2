[project]
name = "meok-sovereign-search-mcp"
version = "1.0.0"
description = "Sovereign Search MCP - full-text + keyword search over the substrate. Title boost + tag boost + TF scoring. BFT 3-voter clear."
requires-python = ">=3.10"
dependencies = []
authors = [
    {name = "CSOAI Ltd (UK 16939677)", email = "nicholas@csoai.org"},
]
license = {text = "MIT"}

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]