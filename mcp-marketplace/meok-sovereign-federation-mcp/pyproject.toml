[project]
name = "meok-sovereign-federation-mcp"
version = "1.0.0"
description = "Sovereign Federation MCP — 5D Hive + 12 Generals + 1 GCP VM each + AB Uno + Sephiroth. Cross-VM federation, load balancing, sigil-signed broadcasts, BFT health voting."
requires-python = ">=3.10"
dependencies = []
authors = [
    {name = "CSOAI Ltd (UK 16939677)", email = "nicholas@csoai.org"},
]
license = {text = "MIT"}

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]