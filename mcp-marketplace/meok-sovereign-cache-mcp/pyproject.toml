[project]
name = "meok-sovereign-cache-mcp"
version = "1.0.0"
description = "Sovereign Cache MCP - in-memory + persistent key-value cache with TTL. BFT 3-voter clear. Sigil every operation."
requires-python = ">=3.10"
dependencies = []
authors = [
    {name = "CSOAI Ltd (UK 16939677)", email = "nicholas@csoai.org"},
]
license = {text = "MIT"}

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]