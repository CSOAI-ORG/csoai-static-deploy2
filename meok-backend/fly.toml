# =====================================================================
# Fly.io deployment for MEOK SOV3 Sovereign Composite
# https://fly.io/docs/reference/configuration/
# Deploy: flyctl deploy --remote-only
# =====================================================================

app = "meok-sov3-backend"
primary_region = "lhr"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile"
  ignorefile = ".dockerignore"
  watch = true

[env]
  MEOK_ENV = "production"
  MEOK_PORT = "3101"
  MEOK_WORKERS = "2"
  MEOK_SOVEREIGN = "true"
  PYTHONUNBUFFERED = "1"
  PYTHON_DONT_WRITE_BYTECODE = "1"

[experimental]
  auto_rollback = true

[[services]]
  protocol = "tcp"
  internal_port = 3101
  auto_stop_machines = false   # sovereign — no sleeping
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.tcp_checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

  [[services.http_checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "post"
    path = "/mcp"
    protocol = "http"
    tls_skip_verify = false

[vm]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024

[[vm.mounts]]
  source = "meok_data"
  destination = "/data"

[deploy]
  strategy = "bluegreen"
  wait_timeout = "120s"
  release_command = "python -m sovereign.healthcheck"

[metrics]
  port = 3101
  path = "/metrics"
