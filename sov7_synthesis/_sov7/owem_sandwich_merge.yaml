# owem_sandwich_merge.yaml — TIES merge of 4 GSPC top specialists into a tier-top OOWM.
# See sov7_synthesis/_sov7/owem_sandwich_README.md for full derivation.
# Source-of-truth: evidence/harness/freeze/latest/govbench-owem-leaderboard.jsonl (129 rows, 26 dims).

merge_method: ties
base_model: qwen2.5:1.5b
models:
  # sov34:latest — wins 11 axes (broadest lead count)
  - model: sov34:latest
    parameters:
      weight: 1.0
      density: 0.50
  # sov33-unified:latest — wins 8 axes including SAFETY 100%
  - model: sov33-unified:latest
    parameters:
      weight: 0.95
      density: 0.45
  # sov-compliance:latest — wins 5 axes (PRIVACY, TRANSPARENCY, CONSISTENCY, CROSS_WALK, DEFENCE)
  - model: sov-compliance:latest
    parameters:
      weight: 0.75
      density: 0.40
  # sov-ethics-art5:latest — wins 2 axes (AGENTIC, COMPLIANCE); smallest weight
  - model: sov-ethics-art5:latest
    parameters:
      weight: 0.55
      density: 0.35

parameters:
  normalize: true
  lambda_: 1.0
dtype: bfloat16
tokenizer_source: base