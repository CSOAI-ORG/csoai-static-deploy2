<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Council of AI — AG UI (seamless)</title>
<meta name="description" content="Council of AI AG UI — one seamless interface: 15 side-menu tabs, chat per axis, tools and security checks inside the window. Measurement, not certification."/>
<style>
:root{--bg:#0b1020;--panel:#131a30;--panel2:#0f1526;--line:#243056;--accent:#4f8cff;--text:#e8ecf8;--muted:#9aa7cc;--ok:#3ddc84;--gold:#fc6}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;height:100vh;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:12px;padding:10px 18px;border-bottom:1px solid var(--line)}
header img{width:38px;height:38px;border-radius:9px}
header h1{font-size:16px}
header .sub{color:var(--muted);font-size:11.5px}
.body{display:flex;flex:1;min-height:0}
aside{width:220px;border-right:1px solid var(--line);background:var(--panel2);overflow-y:auto;padding:8px}
aside .grp{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);opacity:.7;padding:12px 12px 5px}
aside .tab{display:block;width:100%;text-align:left;background:none;border:0;color:var(--muted);padding:9px 12px;border-radius:8px;font-size:13px;cursor:pointer;margin-bottom:2px}
aside .tab:hover{background:#1a2342;color:var(--text)}
aside .tab.active{background:var(--accent);color:#fff;font-weight:600}
aside .tab .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ok);margin-right:8px;vertical-align:middle}
main{flex:1;display:flex;flex-direction:column;min-width:0}
.chat-head{display:flex;align-items:center;gap:10px;padding:10px 18px;border-bottom:1px solid var(--line)}
.chat-head h2{font-size:15px}
.chat-head .sub{color:var(--muted);font-size:11px}
.chat-head .tools{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.chat-head .tool{font-size:11px;color:var(--muted);border:1px solid var(--line);padding:3px 9px;border-radius:12px;cursor:pointer}
.chat-head .tool:hover{color:var(--accent);border-color:var(--accent)}
.msgs{flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:82%;padding:10px 14px;border-radius:12px;font-size:13px;line-height:1.5}
.msg.user{align-self:flex-end;background:var(--accent);color:#fff}
.msg.ag{align-self:flex-start;background:var(--panel);border:1px solid var(--line)}
.msg .win{display:block;margin-top:8px;background:var(--bg);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.msg .win iframe{width:100%;height:260px;border:0}
.msg .win .winbar{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;font-size:11px;color:var(--muted);border-bottom:1px solid var(--line)}
.msg .win .winbar a{color:var(--accent);text-decoration:none}
.kintro{color:var(--muted);font-size:12.5px;margin-bottom:6px}
.kblock{margin-top:10px}
.khead{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--gold);margin-bottom:6px}
.krow{border-left:2px solid var(--line);padding:4px 0 4px 10px;margin-bottom:6px}
.kname{font-weight:600;font-size:12.5px}
.kwhat{color:var(--muted);font-size:11.5px;margin-top:2px}
.kadopt{color:var(--ok);font-size:11px;margin-top:3px}
.kadoptlist{margin:0 0 0 18px;display:flex;flex-direction:column;gap:5px}
.kadoptlist li{font-size:12px;line-height:1.45;color:var(--text)}
.input-bar{display:flex;gap:8px;padding:10px 18px;border-top:1px solid var(--line)}
.input-bar input{flex:1;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:10px 14px;font-size:13.5px}
.input-bar button{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:10px 18px;cursor:pointer;font-weight:600}
footer{padding:8px 18px;border-top:1px solid var(--line);color:var(--muted);font-size:11px}
</style>
</head>
<body>
<header>
  <img src="https://huggingface.co/Nicholastempleman/csoai-logo/resolve/main/csoai-logo-400.png" alt="CSOAI"/>
  <div><h1>Council of AI — AG UI</h1><div class="sub">Measurement, not certification · 13 measured of 14 · one interface for every task</div></div>
</header>
<div class="body">
  <aside id="tabs"></aside>
  <main>
    <div class="chat-head"><div><h2 id="axisTitle">Governance</h2><div class="sub" id="axisSub"></div></div>
      <div class="tools" id="tools"></div>
    </div>
    <div class="msgs" id="msgs"></div>
    <div class="input-bar">
      <input id="inp" placeholder="New task = new chat. Ask anything about this axis…"/>
      <button id="send">Send</button>
    </div>
  </main>
</div>
<footer>any new task is a new chat · the same AG UI for everything · verified measurement credential</footer>
<script>
window.__coaHeroLoaded=true;
const AXES=[{id:"governance",title:"Governance",sub:"EU AI Act articles · risk tiers · signed evidence",tools:[{t:"Scoreboard",u:"https://councilof.ai/gspc-scoreboard"},{t:"Regulation",u:"https://councilof.ai/api/regulation"},{t:"Corrections",u:"https://csoai.org/api/corrections"}],knowledge:"<div class=\"kintro\">**Scope:** Top AI-governance / EU AI Act compliance platforms &amp; peers, researched for the GSPC **GOVERNANCE** axis and the Council of AI **AG UI** Governance chat window.</div><div class=\"kblock\"><div class=\"khead\">Top-10 competitors / peers</div><div class=\"krow\"><div class=\"kname\">Credo AI</div><div class=\"kwhat\">Unified AI Governance platform — discover, assess, govern, monitor, report on every AI agent/model/app. Proprietary \"Governance Knowledge Graph\" links regulations → business context → system configs. Ships GAIA (governan</div><div class=\"kadopt\">↳ adopt: Embed an in-chat \"Governance Assistant\" grounded in a CSOAI knowledge graph (16 axes × EU AI Act articles) that retrieves evidence and drafts risk assessments on demand.</div></div><div class=\"krow\"><div class=\"kname\">Holistic AI</div><div class=\"kwhat\">End-to-end AI governance in three verbs — Identify (auto AI discovery/inventory across AWS/Azure/GitHub/Databricks/20+), Protect (40+ tests: bias, fairness, toxicity, hallucination, prompt injection, adversarial, red-tea</div><div class=\"kadopt\">↳ adopt: Add a one-shot \"run compliance test\" action in chat that maps the user's system to the 16 GSPC axes + EU AI Act gaps (their \"40+ tests → risk score → framework mapping\" pattern).</div></div><div class=\"krow\"><div class=\"kname\">LatticeFlow AI</div><div class=\"kwhat\">Control AI risk in the agentic world — Swiss (ETH Zurich / INSAIT spinout). Three components: Atlas (public registry of 40+ frameworks, 400+ controls, 100+ risks mapped to ready-to-run evals), Evaluate (100+ YAML-spec ev</div><div class=\"kadopt\">↳ adopt: Expose a browsable framework → control → test library in the chat (their \"AI Atlas\" idea): let users ask \"what does Article 9 require and how do I test it?\"</div></div><div class=\"krow\"><div class=\"kname\">Saidot</div><div class=\"kwhat\">AI governance built on a knowledge graph: systems, models, agents, datasets, risks, controls, policies form a directed graph so governance applied once inherits to everything linked. Expert-curated library of risks/polic</div><div class=\"kadopt\">↳ adopt: Copy \"start from curated knowledge, not a blank sheet\" — the Governance chat should auto-recommend GSPC axes/risks/controls from what the user describes, with inheritance (govern once → applies to linked systems).</div></div><div class=\"krow\"><div class=\"kname\">OneTrust AI Governance</div><div class=\"kwhat\">\"AI-Ready Governance Platform\" — continuous EU AI Act governance: register systems/models/agents/datasets/third-party AI, continuous risk management (Art. 9), post-market monitoring (Art. 72), enforcement-ready evidence </div><div class=\"kadopt\">↳ adopt: Make the chat evidence-first: every answer cites the Act article and produces an \"enforcement-ready\" record (ties to CSOAI's signed h3k/sigil card — evidence by default).</div></div><div class=\"krow\"><div class=\"kname\">IBM watsonx.governance</div><div class=\"kwhat\">\"Govern any AI, anywhere.\" Governance graph (living map of AI ecosystem), shadow AI detection, AI-native governance (embedded assistants + conversational interfaces), continuous monitoring, risk management, policy enforc</div><div class=\"kadopt\">↳ adopt: Offer a free self-serve entry + a \"living map\" visualization of the user's governance posture surfaced inside chat (IBM's governance-graph + trial-onboarding pattern).</div></div><div class=\"krow\"><div class=\"kname\">ServiceNow AI Control Tower</div><div class=\"kwhat\">Control plane to discover, govern, secure, observe, measure AI across the enterprise (5 pillars). Treats MCP servers as governed assets, Managed/Unmanaged asset states, risk-based classification at intake, anonymous AI r</div><div class=\"kadopt\">↳ adopt: Copy risk classification at intake: a guided multi-turn intake in the Governance chat that classifies risk tier (and banned/high-risk/limited) before answering, plus an anonymous \"report a concern\" path.</div></div><div class=\"krow\"><div class=\"kname\">Truyo</div><div class=\"kwhat\">AI governance + data privacy in one. AI Inventory (scan website/source-code/content for AI footprints), assessments, AI governance training, model validation, risk management, AI consent. Discover AI use-case, scramble/d</div><div class=\"kadopt\">↳ adopt: Copy the \"scan → inventory\" self-serve starter: chat asks a short questionnaire and generates an AI-usage inventory + risk map as the session's first artifact.</div></div><div class=\"krow\"><div class=\"kname\">Asenion *(formerly Fairly AI)*</div><div class=\"kwhat\">Next-gen AI GRC — Assess (living ISO 42001 / NIST / EU AI Act-aligned system), Test (adversarial + behavioral red-teaming), Assure (runtime governance for agentic AI/LLMs). Fairly AI acquired Anch.AI to become Asenion. I</div><div class=\"kadopt\">↳ adopt: Copy Assess → Test → Assure as the chat's mental model, and offer a \"red-team this\" test action inside the Governance axis (not just assessment).</div></div><div class=\"krow\"><div class=\"kname\">Vanta *(see also Drata)*</div><div class=\"kwhat\">\"Agentic Trust Management Platform\" — broad compliance/GRC with an AI Governance module. Frameworks include NIST AI RMF, ISO 42001, EU AI Act, SOC 2, ISO 27001, GDPR, HIPAA, DORA, NIS2. Vanta AI agents automate evidence/</div><div class=\"kadopt\">↳ adopt: Copy the framework picker + public Trust Center: chat offers \"EU AI Act / ISO 42001 / NIST AI RMF\" as selectable starting points and emits a shareable trust/transparency report.</div></div></div><div class=\"kblock\"><div class=\"khead\">What CSOAI should adopt (5)</div><ol class=\"kadoptlist\"><li>Embed a cited EU AI Act knowledge base + article lookup (content).</li><li>Add a guided classification flow with risk-tier output (flow).</li><li>Make every answer evidence-first and signed (tool).</li><li>Ground answers in a knowledge graph that recommends (tool).</li><li>Add a self-serve \"measure now\" action + shareable trust output (flow).</li></ol></div>"},{id:"safety",title:"Safety",sub:"jail banks · rainbow probes · sandbox scans · signed packs",tools:[{t:"Verify",u:"https://csoai.org/verify/"},{t:"asisecurity.ai",u:"https://asisecurity.ai"},{t:"GSPC axes",u:"https://councilof.ai/api/gspc"}],knowledge:"<div class=\"kintro\">**Prepared for:** Council of AI (CSOAI) — neutral AI-governance measurement body **Axis:** SAFETY (jailbreak / refusal / security-safety — asisecurity.ai, rainbow testing, jail banks, sandboxes) **Date:** 2026-08-21 · **Researcher lane:** JEEVES (delegated subagent)</div><div class=\"kblock\"><div class=\"khead\">Top-10 competitors / peers</div><div class=\"krow\"><div class=\"kname\">garak (NVIDIA)</div><div class=\"kwhat\">Open-source LLM vulnerability scanner — probes hallucination, data leakage, prompt injection, misinformation, toxicity, jailbreaks. \"nmap / Metasploit for LLMs.\"</div><div class=\"kadopt\">↳ adopt: Adopt its probe taxonomy + trigger/detector structure — label *why* a response failed (which probe category), like nmap output, instead of a flat pass/fail.</div></div><div class=\"krow\"><div class=\"kname\">PyRIT (Microsoft)</div><div class=\"kwhat\">Open-source AI red-teaming framework (\"Python Risk Identification Tool for generative AI\") — orchestrates attacks, scores, and stores results.</div><div class=\"kadopt\">↳ adopt: Adopt its orchestrator + persistent memory model — every probe in the Safety window is *scored and persisted* to a ledger (feeds our living DB → sim_emit_card), not just shown.</div></div><div class=\"krow\"><div class=\"kname\">AILuminate (MLCommons)</div><div class=\"kwhat\">Standardized LLM safety benchmark + public leaderboard — grades models on a set of hazard categories with a 5-point scale; now multimodal + jailbreak + agentic workstreams.</div><div class=\"kadopt\">↳ adopt: Adopt its 5-point grade scale + hazard taxonomy so the Safety window shows a standardized safety *grade badge* per hazard, plus its \"hold the live set private to prevent contamination\" discipline.</div></div><div class=\"krow\"><div class=\"kname\">promptfoo</div><div class=\"kwhat\">Open-source LLM eval + red-teaming framework — declarative YAML config, jailbreak/prompt-injection strategies, guardrails, CI/CD.</div><div class=\"kadopt\">↳ adopt: Adopt its declarative \"redteam config\" + named attack strategies — let the Safety window load a JSON attack plan and run named strategies (jailbreak, prompt-injection, RAG leakage) with assertions, CI-style.</div></div><div class=\"krow\"><div class=\"kname\">Lakera</div><div class=\"kwhat\">Commercial AI security platform: Lakera Guard (real-time prompt-injection/jailbreak detection) + Red (red teaming) + workforce/agent security.</div><div class=\"kadopt\">↳ adopt: Adopt the inline refusal-score UI — show a live per-prompt verdict with *category confidence* (prompt-injection vs jailbreak vs safe) and a reason, like Lakera Guard's classify output.</div></div><div class=\"krow\"><div class=\"kname\">Protect AI → Prisma AIRS (Palo Alto Networks)</div><div class=\"kwhat\">AI security platform: Guardian (model scanning) + Recon (red teaming) + open-source llm-guard. Verified change: protectai.com now redirects to Palo Alto's \"Prisma AIRS\" platform; protectai/llm-guard README states the pro</div><div class=\"kadopt\">↳ adopt: Adopt a \"scan before you probe\" preflight — run a model/registry integrity scan (backdoored-weight / malicious-dependency signal) and show it *before* the jail-bank probe results.</div></div><div class=\"krow\"><div class=\"kname\">Adversa AI</div><div class=\"kwhat\">Commercial continuous AI red-teaming platform for LLM + agentic AI; publishes the AIRQ AI Risk Quadrant (rates enterprise agents).</div><div class=\"kadopt\">↳ adopt: Adopt attack-technique → framework mapping — tag every jail-bank prompt with its OWASP LLM Top 10 / MITRE ATLAS technique so results are traceable to a governance framework (essential for a *measurement* body).</div></div><div class=\"krow\"><div class=\"kname\">HiddenLayer</div><div class=\"kwhat\">Commercial AISec Platform: AI discovery (shadow AI), AI attack simulation, AI supply-chain security, AI runtime security, model scanner.</div><div class=\"kadopt\">↳ adopt: Adopt the \"attack simulation\" framing — a continuous, automated adversarial-run view (not one-off), plus a provenance/supply-chain check before trusting a model's safety score.</div></div><div class=\"krow\"><div class=\"kname\">Giskard</div><div class=\"kwhat\">Open-source eval + red-teaming + test generation for agentic systems; automatic LLM vulnerability scanner (giskard-scan).</div><div class=\"kadopt\">↳ adopt: Adopt the one-click \"scan → severity report\" UX — a single action that returns categorized vulnerabilities with severity levels, the way Giskard's scan report is structured.</div></div><div class=\"krow\"><div class=\"kname\">NeMo Guardrails (NVIDIA)</div><div class=\"kwhat\">Open-source programmable guardrails toolkit — sits between app and LLM and enforces rails (input/output/dialog/retrieval/execution) via the Colang DSL.</div><div class=\"kadopt\">↳ adopt: Adopt the \"which rail caught it\" view — visualize input-rail vs output-rail vs retrieval-rail so the user sees *where* the guard triggered, not just that it blocked.</div></div></div><div class=\"kblock\"><div class=\"khead\">What CSOAI should adopt (5)</div><ol class=\"kadoptlist\"><li>Embed a queryable jail bank with a standard attack taxonomy</li><li>Sign every Safety result as an asisecurity evidence pack</li><li>Add rainbow-teaming open-ended probe generation</li><li>Add a one-click sandboxed probe runner</li><li>Standardize scoring + visualize *where* the guard fired</li></ol></div>"},{id:"provenance",title:"Provenance",sub:"chain of custody · where a result came from · verify",tools:[{t:"Verify",u:"https://csoai.org/verify/"},{t:"Regulation",u:"https://councilof.ai/api/regulation"}],knowledge:"<div class=\"kintro\">**CSOAI · GSPC PROVENANCE axis (signed evidence · content authenticity · watermarking · verifiable records)** **Prepared:** research-only, no accounts, no submissions. **Honesty rule:** every claim below traces to a cited source; where a claim could not be independently confirmed it is flagged, not asserted.</div><div class=\"kblock\"><div class=\"khead\">Top-10 competitors / peers</div><div class=\"krow\"><div class=\"kname\">C2PA / Content Credentials</div><div class=\"kwhat\">Open media-provenance standard</div><div class=\"kadopt\">↳ adopt: A provenance-timeline renderer: turn a raw h3k card into a human-readable who→what→when chain, with a trust-list of recognized signers</div></div><div class=\"krow\"><div class=\"kname\">Truepic</div><div class=\"kwhat\">Secure camera / capture-time authenticity</div><div class=\"kadopt\">↳ adopt: Sign at source, not retroactively — bind the receipt at the measurement instant</div></div><div class=\"krow\"><div class=\"kname\">Sigstore</div><div class=\"kwhat\">Software-supply-chain signing</div><div class=\"kadopt\">↳ adopt: Keyless identity + transparency-log inclusion for low-friction signing UX</div></div><div class=\"krow\"><div class=\"kname\">SCITT (IETF)</div><div class=\"kwhat\">Standards for supply-chain transparency</div><div class=\"kadopt\">↳ adopt: Align our receipt schema toward SCITT Signed Statements for standards interop</div></div><div class=\"krow\"><div class=\"kname\">OpenTimestamps</div><div class=\"kwhat\">Trustless timestamping</div><div class=\"kadopt\">↳ adopt: Bitcoin time-anchor on cards → \"existed before T\" without trusting us</div></div><div class=\"krow\"><div class=\"kname\">vaara (vaaraio/vaara)</div><div class=\"kwhat\">AI-governance evidence layer</div><div class=\"kadopt\">↳ adopt: The \"Resin\" single-file offline verifier + the six-lens verify-bundle + explicit \"what a pass does NOT establish\"</div></div><div class=\"krow\"><div class=\"kname\">PipeLab (Pipelock)</div><div class=\"kwhat\">Independent mediator receipts</div><div class=\"kadopt\">↳ adopt: Self vs independent attestation labeling + a public conformance corpus + exit-code CLI verifier</div></div><div class=\"krow\"><div class=\"kname\">signet-auth (Prismer-AI)</div><div class=\"kwhat\">Agent tool-call receipts</div><div class=\"kadopt\">↳ adopt: MCP-native signing (drop-in signet proxy) + bilateral co-signing + delegation chains</div></div><div class=\"krow\"><div class=\"kname\">OpenAI provenance</div><div class=\"kwhat\">Model-output provenance</div><div class=\"kadopt\">↳ adopt: Provenance at generation time + a \"is this CSOAI-generated?\" detector</div></div><div class=\"krow\"><div class=\"kname\">SynthID (Google DeepMind)</div><div class=\"kwhat\">Statistical watermarking</div><div class=\"kadopt\">↳ adopt: Watermark as lossy-but-robust fallback when crypto metadata is stripped</div></div></div><div class=\"kblock\"><div class=\"khead\">What CSOAI should adopt (5)</div><ol class=\"kadoptlist\"><li>C2PA / Content Credentials</li><li>SCITT (IETF)</li><li>OpenTimestamps</li><li>vaara (vaaraio/vaara) — *closest architectural peer to CSOAI*</li><li>PipeLab (Pipelock) — *the \"independent attestation\" peer*</li></ol></div>"},{id:"continuity",title:"Continuity",sub:"post-market monitoring · Art 72 · re-attestation",tools:[{t:"Regulation",u:"https://councilof.ai/api/regulation"},{t:"GSPC axes",u:"https://councilof.ai/api/gspc"}],knowledge:"<div class=\"kintro\">**Prepared for:** Council of AI (CSOAI) — GSPC CONTINUITY axis **Scope:** hash-chained ledgers, anchor/immutability, ongoing re-attestation, timestamp anchoring **Method:** web_search + curl verification; verified claims only; no accounts, no submissions. **Honesty note:** every claim below is tied to a public source. Where a product's \"permanence\" is economic rather than cryptographic (Arweave, IPFS), that is stated explicitly and not overstated.</div><div class=\"kblock\"><div class=\"khead\">Top-10 competitors / peers</div><div class=\"krow\"><div class=\"kname\">Sigstore (Rekor + Cosign + Fulcio)</div><div class=\"kwhat\">Rekor/Sigstore — transparency log</div><div class=\"kadopt\">↳ adopt: Show a log-inclusion proof (signed entry + Merkle proof), not just a bare hash</div></div><div class=\"krow\"><div class=\"kname\">OpenTimestamps</div><div class=\"kwhat\">Bitcoin timestamping (trustless)</div><div class=\"kadopt\">↳ adopt: Display the anchor path — calendar → Bitcoin tx id → block height</div></div><div class=\"krow\"><div class=\"kname\">Arweave</div><div class=\"kwhat\">Permanent storage (blockweave)</div><div class=\"kadopt\">↳ adopt: Pay-once endowment → commit each card hash with a guaranteed minimum retention promise</div></div><div class=\"krow\"><div class=\"kname\">IPFS</div><div class=\"kwhat\">Content addressing (not a ledger)</div><div class=\"kadopt\">↳ adopt: Content addressing — anchor by CID so any byte change changes the identifier</div></div><div class=\"krow\"><div class=\"kname\">Hedera Consensus Service (HCS)</div><div class=\"kwhat\">Consensus / ordering</div><div class=\"kadopt\">↳ adopt: Fair-ordered consensus timestamp + running hash + sequence number per record</div></div><div class=\"krow\"><div class=\"kname\">SCITT (RFC 9943)</div><div class=\"kwhat\">Supply-chain claims ledger (IETF std)</div><div class=\"kadopt\">↳ adopt: Claim + Receipt separation — emit a machine-readable inclusion receipt per record</div></div><div class=\"krow\"><div class=\"kname\">ProvenDB</div><div class=\"kwhat\">Provenance-ledger product</div><div class=\"kadopt\">↳ adopt: Version-anchored history — expose per-record version chain with hashes</div></div><div class=\"krow\"><div class=\"kname\">CodeNotary immudb (immudb + vcn)</div><div class=\"kwhat\">Attestation-ledger SaaS</div><div class=\"kadopt\">↳ adopt: Continuous attestation — live trust/untrust status + re-attestation, not a one-time hash</div></div><div class=\"krow\"><div class=\"kname\">OriginStamp</div><div class=\"kwhat\">Anchor (BTCTimestamp) SaaS</div><div class=\"kadopt\">↳ adopt: Submit-hash → get-cert one-click UX with a shareable certificate link</div></div><div class=\"krow\"><div class=\"kname\">Guardtime KSI</div><div class=\"kwhat\">Tamper-evident logging (keyless)</div><div class=\"kadopt\">↳ adopt: Keyless timestamp — time proven by inclusion in a *published* global root hash (no key to expire)</div></div></div><div class=\"kblock\"><div class=\"khead\">What CSOAI should adopt (5)</div><ol class=\"kadoptlist\"><li>Sigstore (Rekor / Cosign / Fulcio)</li><li>OpenTimestamps</li><li>Hedera Consensus Service (HCS)</li><li>SCITT (RFC 9943)</li><li>CodeNotary immudb (immudb + vcn)</li></ol></div>"},{id:"jailbreak",title:"Jailbreak",sub:"attack taxonomy · OWASP LLM Top 10 · MITRE ATLAS",tools:[{t:"Jail banks",u:"https://councilof.ai/api/gspc"},{t:"asisecurity.ai",u:"https://asisecurity.ai"},{t:"Rainbow → probes",u:"https://councilof.ai/api/gspc"}],knowledge:"<div class=\"kintro\">**Prepared for:** CSOAI (Council of AI) — AG UI Jailbreak chat window **Axis:** `jailbreak` (jail-break / refusal-safety measurement — jail banks, prompt-injection testing) **Date:** 2026-08-21 **Method:** `web_search` + `curl` (live HTTP + GitHub API verification). No accounts created, no submissions made. **Honesty policy:** verified claims only. Each row below was confirmed live (HTTP 200 / repo metadata / rendered site title) unless explicitly flagged.</div><div class=\"kblock\"><div class=\"khead\">Top-10 competitors / peers</div><div class=\"krow\"><div class=\"kname\">NVIDIA garak</div><div class=\"kwhat\">✅ Yes — active</div></div><div class=\"krow\"><div class=\"kname\">Microsoft PyRIT</div><div class=\"kwhat\">✅ Yes — active</div></div><div class=\"krow\"><div class=\"kname\">Giskard</div><div class=\"kwhat\">✅ Yes — active</div></div><div class=\"krow\"><div class=\"kname\">promptfoo (red-team)</div><div class=\"kwhat\">✅ Yes — active</div></div><div class=\"krow\"><div class=\"kname\">Lakera Guard</div><div class=\"kwhat\">✅ Yes — active</div></div><div class=\"krow\"><div class=\"kname\">Robust Intelligence</div><div class=\"kwhat\">✅ Yes — now Cisco AI Defense</div></div><div class=\"krow\"><div class=\"kname\">Adversa AI</div><div class=\"kwhat\">✅ Yes — active</div></div><div class=\"krow\"><div class=\"kname\">HiddenLayer</div><div class=\"kwhat\">✅ Yes — active</div></div><div class=\"krow\"><div class=\"kname\">UK AISI Inspect</div><div class=\"kwhat\">✅ Yes — active</div></div><div class=\"krow\"><div class=\"kname\">DecodingTrust (RobustQA)</div><div class=\"kwhat\">✅ Yes — benchmark</div></div></div><div class=\"kblock\"><div class=\"khead\">What CSOAI should adopt (5)</div><ol class=\"kadoptlist\"><li>Run the jail banks from chat. Add a \"Run jail bank\" action in the chat window that executes curated banks — garak probes, HarmBench behaviors, JailbreakBench attacks — against a selected target, then renders the structured hitlog/report inline (garak's probe/detector + hitlog model is the reference). No separate CLI.</li><li>asisecurity checks (signed evidence). Wire every jailbreak run into the estate's Ed25519 sign/verify backbone (os.meok.ai/api/sign + /api/verify, referenced live by asisecurity.ai) so each run yields a signed, verifiable evidence pack — a *living attestation*, never a certification. The AG UI chat should emit a verify link + signature alongside every result.</li><li>Rainbow tests (multi-vector sweep). Adopt Giskard's scan()-style concurrent attack sweep plus PyRIT's multi-turn orchestration: run N jailbreak vectors simultaneously against the target and return a ranked severity issue list (worst-first), not a single pass/fail. This is the \"rainbow\" the operator wants to see at a glance.</li><li>The sandbox (hard isolation). Run all jail banks and probes in an isolated sandbox so a probe can never hit a production endpoint or exfiltrate data. Isolation is a first-class safety property of the chat window — the operator must be able to run the most hostile prompt-injection banks with confidence that the only target is the sandboxed model.</li><li>StrongREJECT-style rubric auto-scoring + signed ASR leaderboard. Use StrongREJECT/Inspect scorers to auto-grade each response as *refusal* vs. *harmful-compliance*, compute Attack Success Rate (ASR) per model/attack (JailbreakBench pattern), and publish signed leaderboard entries — turning one-off jailbreak chats into a continuously accumulating, verifiable measurement record.</li></ol></div>"},{id:"affect",title:"Affect",sub:"IEEE 7010 well-being · emotion-AI bans · validity caveats",tools:[{t:"GSPC axes",u:"https://csoai.org/badge/axes.json"},{t:"Regulation",u:"https://councilof.ai/api/regulation"}],knowledge:"<div class=\"kintro\">**Scope:** emotional impact / mental-health-adjacent AI measurement (IEEE 7010 well-being, affective-computing assessment). **Method:** web_search + curl against primary sources (standards pages, PDFs, GitHub, law-firm/think-tank explainers). Verified claims only; sources inline. **Date of research:** 2026-08-21.</div><div class=\"kblock\"><div class=\"khead\">Top-10 competitors / peers</div><div class=\"krow\"><div class=\"kname\">IEEE 7010-2020</div><div class=\"kwhat\">Well-being impact assessment</div><div class=\"kadopt\">↳ adopt: Well-being-indicator readout panel</div></div><div class=\"krow\"><div class=\"kname\">MME-Emotion (+ EmoNet-Face, LibEER)</div><div class=\"kwhat\">Affective-computing eval</div><div class=\"kadopt\">↳ adopt: Split recognition vs. reasoning</div></div><div class=\"krow\"><div class=\"kname\">JMIR Psychotherapy Agent Framework (+ \"Beyond Engagement\")</div><div class=\"kwhat\">Mental-health AI audit</div><div class=\"kadopt\">↳ adopt: Crisis/escalation path + safety scoring</div></div><div class=\"krow\"><div class=\"kname\">Stark &amp; Hoey, FAccT '21</div><div class=\"kwhat\">AIES/FAccT research</div><div class=\"kadopt\">↳ adopt: \"Inferred, not observed\" validity caveat</div></div><div class=\"krow\"><div class=\"kname\">EU AI Act Art. 5(1)(f)</div><div class=\"kwhat\">Emotion-AI regulator</div><div class=\"kadopt\">↳ adopt: Scope-by-context gate</div></div><div class=\"krow\"><div class=\"kname\">PAI \"Ethics of AI &amp; Emotional Intelligence\"</div><div class=\"kwhat\">PAI affective tools</div><div class=\"kadopt\">↳ adopt: \"Known misuses\" framing</div></div><div class=\"krow\"><div class=\"kname\">NIST ARIA + AI 600-1 GenAI Profile</div><div class=\"kwhat\">Emotional-attachment rubric</div><div class=\"kadopt\">↳ adopt: Interaction-style / dependency signal</div></div><div class=\"krow\"><div class=\"kname\">Trismik</div><div class=\"kwhat\">Psychometric AI eval</div><div class=\"kadopt\">↳ adopt: Adaptive, calibrated (uncertainty) measurement</div></div><div class=\"krow\"><div class=\"kname\">EU Commission Prohibited-Practices Guidelines</div><div class=\"kwhat\">Prohibited-provisions guidance</div><div class=\"kadopt\">↳ adopt: Definitional rigor in CSOAI claims</div></div><div class=\"krow\"><div class=\"kname\">IEEE P7014.1</div><div class=\"kwhat\">Emulated-empathy ethics</div><div class=\"kadopt\">↳ adopt: Emulation-disclosure guardrail</div></div></div><div class=\"kblock\"><div class=\"khead\">What CSOAI should adopt (5)</div><ol class=\"kadoptlist\"><li>Well-being-indicator readout instead of a raw emotion score (IEEE 7010).</li><li>Split recognition from reasoning, with a \"why\" trace (MME-Emotion).</li><li>Permanent validity + emulation disclosure (Stark/Hoey + IEEE P7014.1).</li><li>Crisis/escalation + safety path, not engagement (mental-health AI audits).</li><li>Scope-by-context gate + definitional rigor (EU AI Act Art. 5(1)(f) + Commission Guidelines).</li></ol></div>"},{id:"transparency",title:"Transparency",sub:"Art 50 disclosure · model cards · labelling",tools:[{t:"Regulation",u:"https://councilof.ai/api/regulation"},{t:"Corrections",u:"https://csoai.org/api/corrections"}],knowledge:"<div class=\"kintro\">**Prepared for:** Council of AI (CSOAI) — AG UI Transparency chat window **Scope:** Model cards, labeling, transparency reporting, Art 50 disclosure **Honesty note:** Only claims traceable to the cited primary/secondary sources below are asserted. Dates and version numbers are recorded where the source states them. Research only — no accounts created, no submissions made.</div><div class=\"kblock\"><div class=\"khead\">Top-10 competitors / peers</div><div class=\"krow\"><div class=\"kname\">Hugging Face model cards</div><div class=\"kwhat\">A model card is a README.md (with YAML frontmatter) at the root of every Hub model repo, rendered into a rich card: license, languages, tags, base_model, datasets, metrics, and model-index eval results.</div><div class=\"kadopt\">↳ adopt: Structured YAML metadata + auto-rendered eval-result tables — transparency stored as machine-readable fields, not prose.</div></div><div class=\"krow\"><div class=\"kname\">Model Card Toolkit (Google)</div><div class=\"kwhat\">Streamlines/automates generation of model cards: a JSON schema + Python API + HTML/Markdown templates; integrates with TFX/ML Metadata to auto-fill metrics.</div><div class=\"kadopt\">↳ adopt: A machine-readable JSON schema behind the UI — transparency is *generated from data*, not hand-written each time.</div></div><div class=\"krow\"><div class=\"kname\">IBM AI FactSheets</div><div class=\"kwhat\">A standardized \"nutrition label\" factsheet for AI models covering purpose, performance, safety, fairness, lineage, and security — designed to establish trust via consistent disclosure.</div><div class=\"kadopt\">↳ adopt: An always-present \"nutrition label\" panel with fixed fields (purpose, training data, evaluation, limitations) so key facts are never omitted.</div></div><div class=\"krow\"><div class=\"kname\">Microsoft transparency notes</div><div class=\"kwhat\">Per-feature \"Transparency Notes\" for AI services (Azure AI/Foundry, Copilot) with a fixed structure: capabilities, limitations, intended uses, fairness, privacy/security, evaluation.</div><div class=\"kadopt\">↳ adopt: The \"capabilities / limitations / intended uses\" section template — makes disclosure consistent and skimmable.</div></div><div class=\"krow\"><div class=\"kname\">EU AI Act Art 50 guidance</div><div class=\"kwhat\">Codifies transparency obligations: (1) human-interaction disclosure unless obvious; (2) GenAI synthetic content must be marked in a machine-readable format and detectable; (3) emotion-recognition/biometric-categorization</div><div class=\"kadopt\">↳ adopt: An Art 50 applicability flag — tell the user *which* obligation applies and *why*, per response.</div></div><div class=\"krow\"><div class=\"kname\">AI Act Explorer (transparency pages)</div><div class=\"kwhat\">An article-by-article navigable interface to the full AI Act text (incl. Art 50 + recitals), maintained on artificialintelligenceact.eu by the Future of Life Institute and partners.</div><div class=\"kadopt\">↳ adopt: Inline article citation — link every transparency statement to the exact Art/recital it implements.</div></div><div class=\"krow\"><div class=\"kname\">System cards (OpenAI / Anthropic / Google)</div><div class=\"kwhat\">Long-form safety documentation for flagship models: red-teaming, capability + safety evaluations (disallowed content, bias, CBRN, cybersecurity), mitigations, and limitations.</div><div class=\"kadopt\">↳ adopt: Show numeric safety-eval results, not just qualitative claims — evidence tables over adjectives.</div></div><div class=\"krow\"><div class=\"kname\">Model Openness Framework (MOF)</div><div class=\"kwhat\">Defines 17 components across the model lifecycle (datasets, data preprocessing, code, training, evaluation, weights, etc.) and three graded classes: Class I (open science), Class II (open tooling/weights), Class III (ope</div><div class=\"kadopt\">↳ adopt: A graded openness level (not binary \"open/closed\") with a visible component checklist of what is actually released.</div></div><div class=\"krow\"><div class=\"kname\">Stanford FMTI (Foundation Model Transparency Index)</div><div class=\"kwhat\">Scores foundation-model developers on 100 indicators across upstream (data, labor, compute), model (capabilities, risks, mitigations), and downstream (distribution, usage policies, impact). v1.0 Oct 2023; v1.1 May 2024 (</div><div class=\"kadopt\">↳ adopt: A quantitative transparency score (upstream/model/downstream breakdown) so transparency is comparable, not just asserted.</div></div><div class=\"krow\"><div class=\"kname\">C2PA Content Credentials (label-making)</div><div class=\"kwhat\">Open technical spec + open-source SDK for cryptographically signed provenance metadata (\"Content Credentials\") attached to media; used for AI-content disclosure/labeling (e.g., Azure OpenAI Content Credentials, Google Sy</div><div class=\"kadopt\">↳ adopt: Signed, verifiable provenance on outputs — transparency that can be *checked*, not merely claimed. (CSOAI is already a C2PA Contributor Member.)</div></div></div><div class=\"kblock\"><div class=\"khead\">What CSOAI should adopt (5)</div><ol class=\"kadoptlist\"><li>Always-present \"nutrition label\" panel *(IBM FactSheets + HF model cards + Microsoft template)* — Pin a fixed, non-collapsible strip above the transcript with always-filled fields: model identity/version · training-data lineage · evaluation method · known limitations · last-updated date. Never freeform; every field must be populated or the UI shows \"UNMEASURED\" (consistent with CSOAI's honest-UNME</li><li>Machine-readable JSON backing every transparency claim *(Google MCT + HF YAML)* — Store transparency as a versioned, signed JSON schema (fields for license, data, metrics, eval results), and render the chat window from that schema. This turns \"we are transparent\" into *data-backed* cards, and lets eval results appear as numeric tables (like HF's model-index) instead of adjectives.</li><li>Art 50 applicability flag per response *(EU AI Act Art 50 + AI Act Explorer)* — For each AG UI output, show a one-line strip: *\"Art 50(2) synthetic-content marking applies → machine-readable label attached\"* (or 50(1) human-interaction disclosure, 50(4) deepfake disclosure, or \"N/A — not in scope\"), each linked to the exact article/recital text. This operationalizes the 2 Aug 2026 obligation and m</li><li>Quantitative transparency score + graded openness level *(Stanford FMTI + MOF)* — Replace any binary \"transparent\" badge with: (a) a transparency score broken into upstream / model / downstream (FMTI-style, with the indicator count shown), and (b) a graded openness level (MOF Class I/II/III-style) with a visible 17-component checklist of what is actually released vs. withheld. Honest, comparable, </li><li>Signed Content Credentials on outputs *(C2PA)* — Attach cryptographically signed provenance metadata to AG UI outputs (media and text), and surface a \"Verify\" affordance in the window that lets any reader check the credential independently. Because CSOAI is already a C2PA Contributor Member, this is native to the estate and turns the transparency *claim* into a *verifiable measurement* — which is </li></ol></div>"},{id:"fairness",title:"Fairness",sub:"bias audit · ll144 · Art 10 data governance",tools:[{t:"GSPC axes",u:"https://csoai.org/badge/axes.json"},{t:"Regulation",u:"https://councilof.ai/api/regulation"}],knowledge:"<div class=\"kintro\">**Scope:** The `FAIRNESS` axis of the GSPC — the `ll144-bias-audit` surface and EU AI Act Art. 10 bias requirements. This is competitive/peer research to learn what the market already builds for bias detection, fairness measurement, and audit, and to extract adoptable ideas for CSOAI's **AG UI Fairness chat window**.</div><div class=\"kblock\"><div class=\"khead\">Top-10 competitors / peers</div><div class=\"krow\"><div class=\"kname\">IBM AI Fairness 360 (AIF360)</div><div class=\"kwhat\">Open-source toolkit: fairness metrics + explanations + bias-mitigation algorithms across the AI lifecycle</div><div class=\"kadopt\">↳ adopt: Metric-with-plain-English-explanation + matched mitigation suggestions in the fairness window</div></div><div class=\"krow\"><div class=\"kname\">Google What-If Tool (WIT)</div><div class=\"kwhat\">No-code visual \"probing\" of a black-box model; counterfactual edits + fairness over data subsets</div><div class=\"kadopt\">↳ adopt: Counterfactual \"what-if\" panel: flip a protected attribute and show the decision delta</div></div><div class=\"krow\"><div class=\"kname\">Microsoft Fairlearn</div><div class=\"kwhat\">Fairness metrics + mitigation algorithms framed around harms (allocation vs quality-of-service)</div><div class=\"kadopt\">↳ adopt: Group-fairness framing: label each check as *allocation harm* vs *quality-of-service harm*</div></div><div class=\"krow\"><div class=\"kname\">Holistic AI</div><div class=\"kwhat\">Commercial AI governance/GRC platform: bias auditing, risk assessment, EU AI Act compliance</div><div class=\"kadopt\">↳ adopt: Bias-audit *evidence* + continuous (not one-shot) re-audit cadence in the UI</div></div><div class=\"krow\"><div class=\"kname\">Credo AI</div><div class=\"kwhat\">Enterprise responsible-AI governance: requirements, risk/fairness assessment, policy, registries</div><div class=\"kadopt\">↳ adopt: Fairness check mapped to a policy/requirement + compliance status trail</div></div><div class=\"krow\"><div class=\"kname\">LatticeFlow</div><div class=\"kwhat\">Model validation &amp; EU AI Act compliance evaluation (incl. LLM bias/fairness)</div><div class=\"kadopt\">↳ adopt: Clause-level regulatory mapping: show which EU AI Act article each fairness check evidences</div></div><div class=\"krow\"><div class=\"kname\">Arthur AI</div><div class=\"kwhat\">Proactive ML model monitoring &amp; observability: performance, drift, bias/fairness</div><div class=\"kadopt\">↳ adopt: Continuous fairness monitoring vs a static snapshot — time-series drift on fairness scores</div></div><div class=\"krow\"><div class=\"kname\">Fiddler AI</div><div class=\"kwhat\">AI observability + explainable AI (SHAP-based): bias/fairness, drift, root-cause</div><div class=\"kadopt\">↳ adopt: Slice/subgroup explorer with explanation overlay on the fairness metric</div></div><div class=\"krow\"><div class=\"kname\">TruEra</div><div class=\"kwhat\">AI quality management: testing, diagnostics (fairness/drift/explainability), monitoring</div><div class=\"kadopt\">↳ adopt: Fairness as a *test suite* with pass/fail gates, not just a report number</div></div><div class=\"krow\"><div class=\"kname\">Parity AI</div><div class=\"kwhat\">Responsible-AI bias auditing, notably recruitment-algorithm audits</div><div class=\"kadopt\">↳ adopt: Third-party/independent-auditor stance: \"we measure, you decide\" neutrality framing</div></div></div><div class=\"kblock\"><div class=\"khead\">What CSOAI should adopt (5)</div><ol class=\"kadoptlist\"><li>IBM AI Fairness 360 (AIF360) ✅ verified via README</li><li>Google What-If Tool (WIT) ✅ verified via README</li><li>Microsoft Fairlearn ✅ verified via README.rst + fairlearn.org</li><li>Holistic AI ✅ vendor site + gov.uk listing</li><li>Credo AI ✅ vendor site + press</li></ol></div>"},{id:"accountability",title:"Accountability",sub:"Art 14 human oversight · override logs · decision records",tools:[{t:"Corrections",u:"https://csoai.org/api/corrections"},{t:"Regulation",u:"https://councilof.ai/api/regulation"}],knowledge:"<div class=\"kintro\">Learning for this axis is still being researched. Ask anyway — the chat will route to the tools.</div>"},{id:"efficiency",title:"Efficiency",sub:"compute/energy per point · cheap deterministic verify",tools:[{t:"Arena",u:"https://csoai.org/api/arena/rounds.jsonl"},{t:"GSPC axes",u:"https://csoai.org/badge/axes.json"}],knowledge:"<div class=\"kintro\">**Scope:** cost / energy / compute efficiency measurement — the 20%-monitoring-overhead angle and \"cheap deterministic verification.\"</div><div class=\"kblock\"><div class=\"khead\">Top-10 competitors / peers</div><div class=\"krow\"><div class=\"kname\">MLPerf Power (MLCommons)</div><div class=\"kwhat\">Optional power/energy dimension of the MLPerf Training/Inference benchmark suites. Measures energy consumed to accomplish a task (e.g. a training run) at node level, not just speed.</div><div class=\"kadopt\">↳ adopt: The calibrated measurement bar: report ≥1 sample/sec, max(run, 60 samples), and target ±5% accuracy at 1 Hz (SPEC/revenue-grade meter or an Olympic-scored comparison test). CSOAI's Efficiency window should state a numeri</div></div><div class=\"krow\"><div class=\"kname\">Green Algorithms (green-algorithms.org, Cambridge)</div><div class=\"kwhat\">Open-source carbon calculator for computational tasks; methodology by Lannelongue, Grealey &amp; Inouye (2021, *Adv. Sci.*, DOI 10.1002/advs.202100707). Also Greencard + GA4H (health).</div><div class=\"kadopt\">↳ adopt: The \"greencard\" — a standardized, downloadable, self-contained summary badge for a single computation. CSOAI's window can emit a per-turn/per-query efficiency card (fits the existing 3KB signed-card format).</div></div><div class=\"krow\"><div class=\"kname\">CodeCarbon (mlco2/codecarbon, codecarbon.io)</div><div class=\"kwhat\">Python library to estimate &amp; track CO₂ from local compute (CPU/GPU/TPU). MIT, open source (MILA / BCG GAMMA / Comet / Haverford lineage). For GenAI *API* calls it defers to EcoLogits.</div><div class=\"kadopt\">↳ adopt: Ultra-low-friction instrumentation — start/stop decorator + a zero-code CLI that wraps any command. The Efficiency window should auto-instrument with near-zero setup.</div></div><div class=\"krow\"><div class=\"kname\">MLCO2 (mlco2.github.io/impact)</div><div class=\"kwhat\">Early ML carbon estimator from Lacoste, Luccioni &amp; Schmidt — *Quantifying the Carbon Emissions of Machine Learning* (NeurIPS 2019 Climate Change AI workshop, arXiv 1910.09700). Precursor to CodeCarbon.</div><div class=\"kadopt\">↳ adopt: The auto-generated, citation-ready disclosure block — one click produces a reproducible reporting snippet. CSOAI's window should offer \"copy disclosure\" output so any measurement is reportable.</div></div><div class=\"krow\"><div class=\"kname\">MLCommons energy standardization / Power Working Group</div><div class=\"kwhat\">The standards body behind MLPerf; its Power Working Group defines energy-measurement methodology and presents MLPerf Power (e.g. at IEEE HPCA, Mar 2025). Goal: comparable ML-system energy metrics.</div><div class=\"kadopt\">↳ adopt: Versioned, neutral rule governance — a frozen methodology that a community vets before any result is accepted. CSOAI (already neutral) should adopt the discipline of *freezing + versioning* the Efficiency axis method so </div></div><div class=\"krow\"><div class=\"kname\">Hugging Face AI Energy Score</div><div class=\"kwhat\">Standardized energy-efficiency rating for AI model inference across 10 common tasks, all benchmarked on NVIDIA H100; reports GPU energy in Watt-hours; rates 1–5 stars (20% bands); open + proprietary models; leaderboard r</div><div class=\"kadopt\">↳ adopt: Fixed-hardware, banded rating — normalize to one reference hardware, measure *energy* (Wh) not emissions, and map to a 1–5 star band. CSOAI can anchor its Efficiency score to a fixed reference class + time-stamped band s</div></div><div class=\"krow\"><div class=\"kname\">EDP — Energy–Delay Product (metric, not a single tool)</div><div class=\"kwhat\">A figure of merit, not a product: Energy × Delay (and Energy × Delay²), descended from the digital-electronics Power–Delay Product (PDP = power × delay = switching energy per event). Widely used in accelerator/TinyML/MLP</div><div class=\"kadopt\">↳ adopt: Combine energy AND latency into one figure of merit (EDP) — so a fast-but-thirsty model can't hide behind a slow-but-frugal one. The Efficiency window should show J, s, and J·s together.</div></div><div class=\"krow\"><div class=\"kname\">WattTime (marginal-emissions data; now under RMI)</div><div class=\"kwhat\">Nonprofit marginal emissions data provider: API v3 serving MOER (marginal operating emissions rate) + signals like co2_moer and health_damage, enabling automated emissions reduction (AER) — shift compute to cleaner times</div><div class=\"kadopt\">↳ adopt: Marginal (not average) carbon signal + forecast — show gCO₂/kWh *now vs. later* so the user can defer a heavy job to a cleaner window; distinguish marginal from average grid intensity.</div></div><div class=\"krow\"><div class=\"kname\">LangSmith (LangChain) / Langfuse — LLM cost &amp; latency traces</div><div class=\"kwhat\">LLM observability platforms that trace every call and attribute tokens, cost, and latency per trace. Langfuse is open source (MIT, YC W23); LangSmith is LangChain's commercial platform.</div><div class=\"kadopt\">↳ adopt: Zero-config per-call cost/latency attribution with a built-in model price table. The Efficiency window should auto-tag every chat turn with tokens/cost/latency and aggregate by model + axis.</div></div><div class=\"krow\"><div class=\"kname\">Kepler (CNCF sandbox)</div><div class=\"kwhat\">Kubernetes-based Efficient Power Level Exporter — a Prometheus exporter that measures energy consumption at container / pod / node level in K8s clusters (Apache-2.0), attributing energy via system counters + ML power mod</div><div class=\"kadopt\">↳ adopt: Near-zero-overhead continuous telemetry via an exporter/sidecar — sample system counters instead of instrumenting every call. This is the direct answer to the 20%-monitoring-overhead requirement.</div></div></div><div class=\"kblock\"><div class=\"khead\">What CSOAI should adopt (5)</div><ol class=\"kadoptlist\"><li>A deterministic, calibrated measurement bar (from MLPerf Power). Stop showing uncalibrated estimates as if they were measurements. Adopt a stated bar — sample ≥1 Hz, max(run, 60 samples), target ±5% accuracy — and render every figure with an explicit measured | estimated | reference tag plus its accuracy/confidence. Cheap deterministic verification comes from *declaring the meter's own error*, not</li><li>A combined Energy–Delay figure of merit (from EDP). Show J, seconds, and J·s (EDP) for every run, never energy alone. This closes the gaming path where a fast-but-thirsty model outscores a frugal-but-slow one (and vice-versa), and gives the Efficiency axis a single comparable number that already respects the \"efficiency = cost × time\" definition.</li><li>Fixed-reference, banded star rating (from Hugging Face AI Energy Score). Anchor efficiency to a declared reference hardware class, measure energy (Wh), not emissions, and map results to a 1–5 star band with a timestamp (bands are relative and must be re-anchored each round). This keeps comparisons apples-to-apples and lets the window show *efficiency* independent of grid location, while a separate</li><li>Marginal, time-aware carbon signal (from WattTime). Add a marginal carbon intensity readout (gCO₂/kWh, current + short forecast) alongside the flat grid-average number, and let the user see \"run now vs. run in 2h\" before dispatching a heavy job. Marginal ≠ average, and showing both is the honest, decision-useful framing for a cost/energy window.</li><li>Zero-config auto-instrumentation + per-turn tags + a signed efficiency card (from CodeCarbon + Langfuse + Green Algorithms). Instrument with a start/stop decorator and a zero-code CLI wrapper (CodeCarbon); auto-tag every chat turn with tokens / cost / latency / energy and aggregate by model + axis using a built-in model price table (Langfuse); then emit a small signed \"efficiency card\" per turn or</li></ol></div>"},{id:"creativity",title:"Creativity",sub:"novelty vs convergence · originality scoring",tools:[{t:"Arena",u:"https://csoai.org/api/arena/rounds.jsonl"},{t:"GSPC axes",u:"https://csoai.org/badge/axes.json"}],knowledge:"<div class=\"kintro\">**Prepared for:** Council of AI (CSOAI) · AG UI Creativity chat window **Scope:** generative novelty/creativity measurement — divergence vs convergence, originality scoring **Honesty note:** research-only; every claim below was verified against the cited source via web_search + curl (live pages / arXiv / ACL Anthology / GitHub API). Where a named \"suite\" is a loose category rather than a single canonical artifact, that is flagged explicitly rather than overstated. No accounts, no submissions.</div><div class=\"kblock\"><div class=\"khead\">Top-10 competitors / peers</div><div class=\"krow\"><div class=\"kname\">Divergent Association Task (DAT) — Jay Olson (PNAS 2021)</div><div class=\"kwhat\">4-minute verbal-creativity test: name 10 unrelated nouns; score = mean pairwise semantic distance between words</div><div class=\"kadopt\">↳ adopt: Percentile-ranked divergence gauge + \"first score only\" anti-gaming rule — score the user's idea-spread against a norm, but hide the distance breakdown until the round closes</div></div><div class=\"krow\"><div class=\"kname\">AUT (Alternative Uses Test) automation — Acar/Organisciak/Dumas/Beaty</div><div class=\"kwhat\">Automates scoring of the classic Guilford AUT (list alternative uses for an object) with LLMs + semantic distance</div><div class=\"kadopt\">↳ adopt: **Fluency / flexibility / originality triple, where originality = semantic distance from the *crowd* of common answers** — score each user idea against the distribution of typical responses, not just internally</div></div><div class=\"krow\"><div class=\"kname\">Torrance TTCT digitisation (figural CV scoring) — Acar &amp; Organisciak</div><div class=\"kwhat\">Digitises/scales the Torrance Tests of Creative Thinking (figural form) via computer-vision scoring of fluency/originality/elaboration</div><div class=\"kadopt\">↳ adopt: **Treat machine scoring as *attestation*, never autonomous certification** — CSOAI's existing \"Living Attestation, never Living Certification\" stance is exactly right here; show a confidence/validation flag on any auto-s</div></div><div class=\"krow\"><div class=\"kname\">Semantic-distance / novel-object originality metrics — Dumas &amp; Dunbar et al.</div><div class=\"kwhat\">Originality as distributional semantics: an idea is original if semantically distant from the set of typical responses (LSA/word-vector cosine)</div><div class=\"kadopt\">↳ adopt: **Decouple fluency (volume) from originality (distance) as *separate* scores** — two ideas at equal count can differ hugely in novelty; never report a single blended number</div></div><div class=\"krow\"><div class=\"kname\">ML creativity benchmarks — FOCUS, CreativeBench</div><div class=\"kwhat\">Automated LLM creativity eval: FOCUS measures/cuts self-plagiarism; CreativeBench scores code creativity as quality×novelty with self-play</div><div class=\"kadopt\">↳ adopt: Unified metric = quality × novelty (not additive), with an executable/verifiable ground-truth check — so \"creative\" can never hide hallucination; CreativeBench's \"larger = more correct but *less divergent*\" is a real ris</div></div><div class=\"krow\"><div class=\"kname\">Poetry / StoryGen originality evals — \"Who Wrote This Line?\" et al.</div><div class=\"kwhat\">Detects / scores originality of generated poetry &amp; stories (classical + modern Chinese poetry, authorship detection)</div><div class=\"kadopt\">↳ adopt: Show a \"machine-authorship / memorisation risk\" indicator on poetic/story output — flag lines that echo training data or fall into detectable style templates, separate from pure novelty</div></div><div class=\"krow\"><div class=\"kname\">Creative Problem Solving (CPS) evals — RAT / insight / convergent-divergent batteries</div><div class=\"kwhat\">Convergent + divergent thinking batteries (Remote Associates Test, insight problems); now used to benchmark AI vs humans</div><div class=\"kadopt\">↳ adopt: Report BOTH a convergent (correct/solve) and a divergent (idea-spread) channel in the chat window — the axis is \"creativity\", not \"correctness\"; label which is which</div></div><div class=\"krow\"><div class=\"kname\">Originality detectors — self-BLEU / FQ-Eval / RiddleScore</div><div class=\"kwhat\">Measure how much generated text is genuinely novel vs self-repeated or corpus-echoed (n-gram self-overlap, rejection-based originality filters)</div><div class=\"kadopt\">↳ adopt: Live \"novelty strip\": distinct-n + self-BLEU + corpus-overlap shown inline, so users see originality as a *measurable property of the text*, not a vibe</div></div><div class=\"krow\"><div class=\"kname\">Semantic novelty metrics (cross-domain)</div><div class=\"kwhat\">Embedding-based novelty/diversity: cosine distance to nearest known artifact, semantic divergence within a set, dimension-scaled novelty</div><div class=\"kadopt\">↳ adopt: Nearest-neighbour \"distance-to-known\" novelty — score each user/AI idea by how far it sits from the nearest already-seen artifact, with a constructive (not just divergent) framing</div></div><div class=\"krow\"><div class=\"kname\">\"9-creativity-benchmarks\" suites (holistic multi-task) — AGC-Bench, CreativityPrism</div><div class=\"kwhat\">*Honesty flag: no single canonical artifact named exactly \"9 creativity benchmarks\" verified.* The real, verified equivalents are holistic multi-task suites: AGC-Bench (systematic review → 78 datasets / 6 domains, first </div><div class=\"kadopt\">↳ adopt: **Multi-dimensional taxonomy (quality / novelty / diversity) with an open-weight *calibrated* judge and a public percentile leaderboard** — and report novelty SEPARATELY because it correlates poorly with the other axes</div></div></div><div class=\"kblock\"><div class=\"khead\">What CSOAI should adopt (5)</div><ol class=\"kadoptlist\"><li>Real-time semantic-distance divergence gauge, percentile-ranked, \"first score only\" (from DAT).</li><li>Split the axis into two explicit channels: DIVERGENCE vs CONVERGENCE, and surface \"convergence-by-scaling\" (from CreativeBench + CPS evals).</li><li>Score novelty as QUALITY × NOVELTY with a verifiable/executable check (from CreativeBench + FOCUS).</li><li>Live originality strip: distinct-n + self-BLEU + corpus overlap + self-plagiarism penalty (from FOCUS + originality detectors).</li><li>Open-weight calibrated judge + percentile norms, multi-dimension report (from AGC-Bench + CreativityPrism).</li></ol></div>"},{id:"sovereignty",title:"Sovereignty",sub:"portability · opt-out · no lock-in",tools:[{t:"Regulation",u:"https://councilof.ai/api/regulation"},{t:"Verify",u:"https://csoai.org/verify/"}],knowledge:"<div class=\"kintro\">**Axis:** Sovereignty — user control, opt-out, no lock-in, data portability (GDPR Art 20), the ability to leave a system cleanly. **Scope:** Top 10 competitors/peers for the SOVEREIGNTY axis. **Method:** `web_search` + `curl` against primary sources (EUR-Lex, W3C/Solid, spec.c2pa.org, Google/Mastodon/Ollama/Inrupt docs). **Verified claims only**; each row cites the source actually fetched. Research only — no accounts, no submissions. **Date:** compiled 2026.</div><div class=\"kblock\"><div class=\"khead\">Top-10 competitors / peers</div><div class=\"krow\"><div class=\"kname\">GDPR Art 20 — Right to data portability</div><div class=\"kwhat\">Legal right to receive personal data \"provided to a controller\" in a *structured, commonly used, machine-readable format* and transmit it to another controller *without hindrance*; direct controller→controller transfer \"</div><div class=\"kadopt\">↳ adopt: The predicate form: express sovereignty as machine-checkable conditions (format = machine-readable, hindrance = false, direct_transfer = feasible).</div></div><div class=\"krow\"><div class=\"kname\">Solid Pods / Inrupt (ESS)</div><div class=\"kwhat\">Decentralized data ownership: data lives in a Pod the user controls, shared on their terms. W3C Solid Protocol 0.11.0 = \"secure and permissioned access to externally stored data in an interoperable way.\" Inrupt's Enterpr</div><div class=\"kadopt\">↳ adopt: Identity↔storage decoupling: separate the identity from the data store so \"leaving\" is a Pod/WebID move, not a rewrite.</div></div><div class=\"krow\"><div class=\"kname\">Mastodon / ActivityPub federation exit</div><div class=\"kwhat\">Fediverse account migration: export your social graph, redirect/move your identity across instances (ActivityPub Move), and delete cleanly.</div><div class=\"kadopt\">↳ adopt: One-click \"leave\" affordance with explicit redirect-vs-move semantics and a cooldown safety check.</div></div><div class=\"krow\"><div class=\"kname\">Google Takeout (data-export pattern)</div><div class=\"kwhat\">Reference data-export tool: per-product export → archive → deliver. Explicitly notes download ≠ delete.</div><div class=\"kadopt\">↳ adopt: Export ≠ deletion disclosure, plus per-scope selection granularity (choose exactly what leaves).</div></div><div class=\"krow\"><div class=\"kname\">Self-hosted AI — Ollama portability</div><div class=\"kwhat\">Local open-weight models, no API lock-in. Models are open-weight (GGUF/llama.cpp lineage), run locally, pullable/redistributable; REST API on :11434.</div><div class=\"kadopt\">↳ adopt: Open-weight + standard-format = no lock-in: assert \"weights are exportable in an open format\" as a sovereignty predicate.</div></div><div class=\"krow\"><div class=\"kname\">C2PA provenance (rights portability)</div><div class=\"kwhat\">Open standard for content authenticity: a tamper-evident manifest (claim + signed assertions + provenance chain of ingredients) that travels with the asset.</div><div class=\"kadopt\">↳ adopt: Signed manifest that travels with the exported data — make the portability result itself verifiable (CSOAI already ships signed h3k cards; extend the manifest to carry portability predicates).</div></div><div class=\"krow\"><div class=\"kname\">No-lock-in contract clauses (EU Data Act Ch. VI)</div><div class=\"kwhat\">Mandatory switching rights for data-processing services: contract must state switching rights, allow porting exportable data + digital assets, achieve *functional equivalence* after exit, unbundle services; switching cha</div><div class=\"kadopt\">↳ adopt: Exit-contract check: verify a switching clause + \"no egress charge\" + \"functional equivalence on exit\" exist before sign-up.</div></div><div class=\"krow\"><div class=\"kname\">DSP (Dataspace Protocol) portability specs</div><div class=\"kwhat\">Neutral protocol defining rules/procedures for publishing, negotiating, accessing data across platforms — data sovereignty via usage control. Now standardized (ISO-track; Eclipse Dataspace Protocol 2025-1).</div><div class=\"kadopt\">↳ adopt: Portable usage policy: attach the access/usage contract to the data itself, so control survives the transfer.</div></div><div class=\"krow\"><div class=\"kname\">AI Act exit / withdrawal provisions</div><div class=\"kwhat\">Statutory \"off-switch\" semantics: \"recall\" = return to provider / take out of service / disable use; \"withdrawal\" = prevent the system being made available on the market; plus Art 86 right to explanation for affected per</div><div class=\"kadopt\">↳ adopt: Enumerated exit verbs (recall = disable use; withdrawal = off-market) + a right to plain-language explanation of what leaving does.</div></div><div class=\"krow\"><div class=\"kname\">EDPB portability guidance (WP29 WP242 rev.01)</div><div class=\"kwhat\">Authoritative interpretation of Art 20 (WP29 guidelines, endorsed by EDPB): right is limited to data \"provided by the data subject\" (declared + observed), excludes inferred/derived data; machine-readable format required;</div><div class=\"kadopt\">↳ adopt: Scope honesty: surface the \"provided-by-you vs derived-about-you\" split and mark unverifiable items UNMEASURED, not silently \"compliant\".</div></div></div><div class=\"kblock\"><div class=\"khead\">What CSOAI should adopt (5)</div><ol class=\"kadoptlist\"><li>Portability predicates (machine-checkable, GDPR Art 20 + Data Act shaped)</li><li>Exit checks (one-click \"leave\" simulation, Mastodon + AI Act shaped)</li><li>No-lock-in verification (Solid + Ollama + Data Act shaped)</li><li>Signed, portable provenance + policy on the export (C2PA + DSP shaped)</li><li>Scope honesty + right-to-explanation in plain language (EDPB + AI Act Art 86 shaped)</li></ol></div>"},{id:"care",title:"Care",sub:"duty of care · health/social AI · IEEE 7010",tools:[{t:"GSPC axes",u:"https://csoai.org/badge/axes.json"},{t:"Regulation",u:"https://councilof.ai/api/regulation"}],knowledge:"<div class=\"kintro\">**GSPC axis:** CARE — AI that cares (duty-of-care, safety-of-care in health/social contexts, IEEE 7010 social impact). **Prepared for:** CSOAI (Council of AI) — AG UI \"Care\" chat window research. **Method:** Primary sources verified via `curl` (GOV.UK, WHO, NICE, CQC, IEEE, Nature Medicine, vendor sites, regulator/charity sites) plus `web_search`. Only claims corroborated by the fetched primary pages are asserted. No accounts created, no submissions made.</div><div class=\"kblock\"><div class=\"khead\">Top-10 competitors / peers</div><div class=\"krow\"><div class=\"kname\">NHS AI and Digital Regulations Service (AIDRS)</div><div class=\"kwhat\">A curated, single front-door for clinical/digital-health AI regulation and evaluation guidance, maintained jointly by NICE, MHRA, CQC and HRA, split into *developer* and *adopter* tracks.</div><div class=\"kadopt\">↳ adopt: The developer-vs-adopter split — the Care window should ask whether the user is *building* care AI or *using/choosing* it, and serve different duty-of-care guidance for each.</div></div><div class=\"krow\"><div class=\"kname\">MHRA — Software &amp; AI as a Medical Device (SaMD/AIaMD) + AI Airlock</div><div class=\"kwhat\">UK statutory regulator for software/AI that is a medical device; assures safety via technical-file review, post-market surveillance, and a \"Software and AI as a medical device change programme\" plus the AI Airlock regula</div><div class=\"kadopt\">↳ adopt: Qualification/risk-gating question first — before answering, have the Care window help classify whether the subject is informational vs. a regulated medical-device use case, and refuse/redirect clinical decision-support </div></div><div class=\"krow\"><div class=\"kname\">IEEE 7010-2020 — Well-being Impact Assessment (WIA)</div><div class=\"kwhat\">The first international standard for assessing AI's impact on human well-being; a 5-activity, iterative, stakeholder-engaged impact-assessment methodology across 12 well-being domains.</div><div class=\"kadopt\">↳ adopt: The 12-domain well-being indicator dashboard — track a lightweight well-being baseline (affect, psychological/mental well-being, community/social support, health) over the conversation and across sessions.</div></div><div class=\"krow\"><div class=\"kname\">NICE Evidence Standards Framework (ESF) for Digital Health Technologies</div><div class=\"kwhat\">21 evidence standards in 5 lifecycle groups that classify digital-health tech into risk-proportionate tiers (A/B/C) and define the evidence needed to deploy safely.</div><div class=\"kadopt\">↳ adopt: Risk-tiered response gating — classify the care topic by tier (informational / self-management / clinical decision-support) and vary evidence citation, disclaimers and cautions proportionately.</div></div><div class=\"krow\"><div class=\"kname\">WHO — Ethics &amp; governance of AI for health (2021) + LMM guidance (2024)</div><div class=\"kwhat\">Global normative guidance: six core ethics principles (2021) and 40+ recommendations (2024) for governing large multi-modal models across five health applications.</div><div class=\"kadopt\">↳ adopt: A principles bar — surface the six care-ethics principles (protect autonomy, promote well-being, transparency, accountability, inclusiveness/equity, sustainability) as a persistent, checkable strip in the Care window.</div></div><div class=\"krow\"><div class=\"kname\">HealthAI — The Global Agency for Responsible AI in Health</div><div class=\"kwhat\">Geneva-based non-profit building national/regional validation mechanisms, a Global Regulatory Network (GRN), a Community of Practice (CoP), and a Global Directory of registered AI health solutions.</div><div class=\"kadopt\">↳ adopt: Co-production of a shared values statement — mirror HealthAI's \"AI constitution\"-style shared commitments as a one-line, user-visible care pledge in the window.</div></div><div class=\"krow\"><div class=\"kname\">CQC — AI in health &amp; social care</div><div class=\"kwhat\">England's health/social-care regulator; sets out benefits, risks and \"principles of good use of AI\", and inspects providers so AI contributes to safe, effective, equitable, person-centred care (does not certify specific </div><div class=\"kadopt\">↳ adopt: Surface the de-personalisation/hallucination risks explicitly — the Care window should tell users plainly that AI can \"hallucinate and present untrue information authoritatively as fact\" and that human oversight can be n</div></div><div class=\"krow\"><div class=\"kname\">**Mental-health AI auditing — SIM-VAIL (Oxford/UCL/AI Security Institute, *Nature Medicine* 2026)**</div><div class=\"kwhat\">Clinically validated framework that simulates vulnerable users and stress-tests multi-turn chatbot behaviour, scoring exchanges across clinical risk dimensions and mapping \"Vulnerability-Amplifying Interaction Loops\" (VA</div><div class=\"kadopt\">↳ adopt: Multi-turn vulnerability monitoring, not single-message checks — detect and intervene at *early escalation points* (replacing one early concerning response improves the whole trajectory).</div></div><div class=\"krow\"><div class=\"kname\">UK adult social-care AI governance — Digital Care Hub / AI in Social Care Alliance</div><div class=\"kwhat\">Non-profit digital-care advisory body convening an action-focused Alliance to co-produce an \"AI constitution for social care\", practical provider guidance, training and case studies.</div><div class=\"kadopt\">↳ adopt: A co-produced, accessible \"AI constitution\" for the Care window — a short statement of care values and commitments the user can read and hold the tool accountable to.</div></div><div class=\"krow\"><div class=\"kname\">Hippocratic AI — safety-focused healthcare LLM</div><div class=\"kwhat\">Commercial safety-focused healthcare LLM with a proprietary multi-model \"Polaris Constellation\" architecture and a 5-phase safety certification (output testing, clinical supervision, escalation to human nurse, cross-vali</div><div class=\"kadopt\">↳ adopt: A visible escalation-to-human pathway — always offer a handoff to a real person/nurse for crisis or safety-critical care content (duty-of-care affordance).</div></div></div><div class=\"kblock\"><div class=\"khead\">What CSOAI should adopt (5)</div><ol class=\"kadoptlist\"><li>NHS AI and Digital Regulations Service (AIDRS)</li><li>MHRA — Software &amp; AI as a Medical Device</li><li>IEEE 7010-2020</li><li>NICE Evidence Standards Framework (ESF)</li><li>WHO — Ethics &amp; governance of AI for health</li></ol></div>"},{id:"insurance",title:"Insurance",sub:"underwriting data licence · nobody-ranked-pays",tools:[{t:"Pricing",u:"https://csoai.org/api/pricing.json"},{t:"Regulation",u:"https://councilof.ai/api/regulation"},{t:"Measure",u:"https://councilof.ai/measure"}],knowledge:"<div class=\"kintro\">**Scope:** AI liability insurance, the underwriting-data-licence product, and risk assessment for AI deployments — viewed through the AG UI **Insurance chat window**.</div><div class=\"kblock\"><div class=\"khead\">Top-10 competitors / peers</div><div class=\"krow\"><div class=\"kname\">Munich Re (Insure AI / aiSure™)</div><div class=\"kwhat\">Reinsurer that has underwritten AI *performance* risk since 2018; sells tailored risk-transfer for AI errors (lost revenue, business interruption, legal damages) and publishes applied AI-risk research (conformal-predicti</div></div><div class=\"krow\"><div class=\"kname\">AXA XL (CyberRiskConnect Gen-AI endorsement)</div><div class=\"kwhat\">Adds named Gen-AI coverage by endorsement to cyber policy: data poisoning, usage-rights/IP infringement, and EU AI Act regulatory-violation liability.</div></div><div class=\"krow\"><div class=\"kname\">Lloyd's market (LMA AI blueprint + coverholders)</div><div class=\"kwhat\">The marketplace where AI liability actually trades: Armilla is a Lloyd's coverholder; Chaucer co-developed an AI liability product with Armilla; LMA published a market-wide AI governance blueprint; syndicates (e.g. OAK G</div></div><div class=\"krow\"><div class=\"kname\">CFC Underwriting</div><div class=\"kwhat\">Specialty MGA that embeds affirmative AI cover across its cyber/tech/media portfolio (explicitly says when AI-driven loss is covered, rather than leaving \"silent\" ambiguity).</div></div><div class=\"krow\"><div class=\"kname\">Coalition (Active Insurance)</div><div class=\"kwhat\">Tech-first cyber insurer: \"Active\" policy that *prevents* loss in real time; explicitly defines AI-driven events in policy wording; Deepfake Response endorsement (forensic + legal takedown + crisis comms); free risk asse</div></div><div class=\"krow\"><div class=\"kname\">At-Bay (InsurSec / Stance)</div><div class=\"kwhat\">Cyber MGA that ships a bundled security platform (\"Stance\") with every policy — attack-surface monitoring, fraud defense, MDR — built on incident data from 40,000+ insureds.</div></div><div class=\"krow\"><div class=\"kname\">RiskGenius</div><div class=\"kwhat\">AI/NLP engine that reads and automates insurance policies (extraction, comparison, clause analysis); used by Guy Carpenter for silent-cyber analysis and by QBE for policy automation.</div></div><div class=\"krow\"><div class=\"kname\">EU AI Act — Art 6 + Annex III (insurance scoring)</div><div class=\"kwhat\">Classifies \"risk assessment and pricing in relation to natural persons in the case of life and health insurance\" as high-risk (Annex III point 5(b)); imposes governance/data/transparency duties on providers and deployers</div></div><div class=\"krow\"><div class=\"kname\">PRA / BoE (model-risk + AI expectations)</div><div class=\"kwhat\">UK prudential regulator: SS1/23 + PS6/23 model-risk-management principles (banks), April-2024 strategic AI letter to government, Dear-CEO AI expectations, Feb-2026 AI roundtables.</div></div><div class=\"krow\"><div class=\"kname\">AI risk-scoring SaaS (Gradient AI, Linqura, WTW Radar 5)</div><div class=\"kwhat\">Vendors selling insurers ML risk-scoring for underwriting (workers'-comp, P&amp;C) and pricing platforms with Gen-AI; Gradient explicitly builds scoring \"designed for emerging AI regulations.\"</div></div></div><div class=\"kblock\"><div class=\"khead\">What CSOAI should adopt (5)</div><ol class=\"kadoptlist\"><li>Munich Re — Insure AI / aiSure™</li><li>AXA XL — CyberRiskConnect Gen-AI endorsement</li><li>Lloyd's market — LMA AI blueprint + coverholders</li><li>CFC Underwriting</li><li>Coalition — Active Insurance</li></ol></div>"},{id:"training",title:"Training",sub:"per-axis curriculum · micro-lessons · quiz predicates",tools:[{t:"Academy",u:"https://councilof.ai/paper-district"},{t:"Harness",u:"https://pypi.org/project/csoai/"},{t:"Measure",u:"https://councilof.ai/measure"}],knowledge:"<div class=\"kintro\">**Scope:** AI-governance education/academy — turning the 16 measured GSPC axes into learnable material. **Method:** web_search + curl against primary sources. Verified claims only; sources cited inline. **Status:** Research-only. No accounts, no submissions, no paid content accessed.</div><div class=\"kblock\"><div class=\"khead\">Top-10 competitors / peers</div><div class=\"krow\"><div class=\"kname\">EU AI Act Explorer — Future of Life Institute</div><div class=\"kwhat\">Interactive navigator of the EU AI Act's 100+ articles/annexes/recitals, plus a compliance checker. Explicitly a *neutral* tool, \"not associated with the European Union.\"</div><div class=\"kadopt\">↳ adopt: Role + use-case filter on the corpus — a learner says \"I am a deployer building a high-risk system\" and only the relevant obligations surface.</div></div><div class=\"krow\"><div class=\"kname\">ICO — Guidance on AI &amp; data protection (UK regulator)</div><div class=\"kwhat\">Official regulator guidance translating UK GDPR into AI practice across the lifecycle.</div><div class=\"kadopt\">↳ adopt: \"What you need to know\" summary box before every lesson — a 3-line plain-language takeaway that precedes depth.</div></div><div class=\"krow\"><div class=\"kname\">Alan Turing Institute — AI Ethics &amp; Governance in Practice</div><div class=\"kwhat\">Public-sector capacity-building programme; teaches civil servants to *facilitate* ethics, not just read policy.</div><div class=\"kadopt\">↳ adopt: Facilitator (\"AI Ethics Champion\") path — turn a learner into someone who can run a workshop, with role-play dilemma exercises included.</div></div><div class=\"krow\"><div class=\"kname\">Coursera — LSE \"AI Law, Policy &amp; Governance\"</div><div class=\"kwhat\">University certificate course on the global regulatory landscape (US, China, UK, EU).</div><div class=\"kadopt\">↳ adopt: Structured multi-week module arc with a certificate — a defined \"track\" that ends in a verifiable completion credential.</div></div><div class=\"krow\"><div class=\"kname\">UNESCO — Global MOOC on the Ethics of AI (with LG AI Research)</div><div class=\"kwhat\">Free MOOC turning the 193-country-endorsed Recommendation on the Ethics of AI into practical learning.</div><div class=\"kadopt\">↳ adopt: Translate principles → hands-on scenario projects, with multi-language delivery for global reach.</div></div><div class=\"krow\"><div class=\"kname\">NIST — AI Risk Management Framework + Playbook</div><div class=\"kwhat\">Government reference framework (Govern/Map/Measure/Manage) + a Playbook of suggested actions, with sector Profiles and a Roadmap.</div><div class=\"kadopt\">↳ adopt: \"Govern→Map→Measure→Manage\" function scaffold — reuse as the spine that each GSPC axis maps onto.</div></div><div class=\"krow\"><div class=\"kname\">AI Safety Fundamentals — BlueDot Impact</div><div class=\"kwhat\">Free, application/cohort-based talent accelerator for AI safety, alignment and governance.</div><div class=\"kadopt\">↳ adopt: Funnel design: 2-hour free taste → application-gated deeper track — low friction entry, then a commitment gate.</div></div><div class=\"krow\"><div class=\"kname\">MIT Sloan — \"AI Risk &amp; Readiness: From Governance to Growth\"</div><div class=\"kwhat\">Two-day executive course reframing governance as an *enabler* of AI adoption, not a brake.</div><div class=\"kadopt\">↳ adopt: \"Governance = speed\" reframe as the onboarding hook — position the Training lane as the accelerator, not the compliance tax.</div></div><div class=\"krow\"><div class=\"kname\">GovAI (Centre for the Governance of AI)</div><div class=\"kwhat\">Research institute producing governance analysis and *fostering talent* via fellowships rather than courses.</div><div class=\"kadopt\">↳ adopt: Mentorship/alumni network layer — governance education compounds when learners join a peer network that tracks outcomes.</div></div><div class=\"krow\"><div class=\"kname\">Compliance micro-certs — CompTIA SecAI+ &amp; OneTrust</div><div class=\"kwhat\">Vendor-neutral (CompTIA) and vendor (OneTrust) micro-credentials validating AI security/governance skills.</div><div class=\"kadopt\">↳ adopt: Exam-objective \"domain weights\" + a portable badge — publish what % each GSPC axis counts for, and issue a shareable (signed) credential on completion.</div></div></div><div class=\"kblock\"><div class=\"khead\">What CSOAI should adopt (5)</div><ol class=\"kadoptlist\"><li>Curriculum per axis (spine = NIST's Govern→Map→Measure→Manage)</li><li>Micro-lessons with a 2-minute \"Future of AI\" style entry</li><li>Quiz predicates tied to the measured axis</li><li>Role/use-case filter on the whole corpus</li><li>Completion credential + facilitator (\"AI Ethics Champion\") path</li></ol></div>"}];
const tabs=document.getElementById('tabs'),msgs=document.getElementById('msgs'),
      title=document.getElementById('axisTitle'),sub=document.getElementById('axisSub'),
      tools=document.getElementById('tools'),inp=document.getElementById('inp');
function addMsg(text,role,toolLabel,toolUrl,html){
  const d=document.createElement('div');d.className='msg '+role;
  if(html){d.innerHTML='<span>'+text+'</span>'+html;}
  else{d.textContent=text;}
  if(toolUrl){d.innerHTML+='<span class="win"><div class="winbar"><span>'+toolLabel+'</span><a href="'+toolUrl+'" target="_blank">open ↗</a></div><iframe src="'+toolUrl+'" loading="lazy"></iframe></span>';}
  msgs.appendChild(d);msgs.scrollTop=msgs.scrollHeight;
}
function escapeHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function switchAxis(ax){
  title.textContent=ax.title;
  sub.textContent=ax.sub;
  tools.innerHTML=ax.tools.map(t=>'<span class="tool" data-u="'+t.u+'">'+t.t+ '</span>').join('');
  tools.querySelectorAll('.tool').forEach(t=>t.onclick=()=>{addMsg('Opening '+t.textContent+'…','user');addMsg('Tool window — measurement, not certification.','ag',t.textContent,t.dataset.u);});
  addMsg('AG UI ready for the '+ax.title+' axis. New task = new chat — ask or pick a tool below.','ag',null,null,ax.knowledge);
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.ax===ax.id));
}
// Build tabs: two groups (13 measurement axes, then Insurance + Training).
const MEAS=['governance','safety','provenance','continuity','jailbreak','affect','transparency','fairness','accountability','efficiency','creativity','sovereignty','care'];
const EXTRA=['insurance','training'];
function mkTab(ax){const b=document.createElement('button');b.className='tab';b.dataset.ax=ax.id;b.innerHTML='<span class="dot"></span>'+ax.title;b.onclick=()=>{msgs.innerHTML='';switchAxis(ax);};return b;}
function addGroup(label){const g=document.createElement('div');g.className='grp';g.textContent=label;tabs.appendChild(g);}
addGroup('Measurement axes');
MEAS.forEach(id=>{const ax=AXES.find(a=>a.id===id);if(ax)tabs.appendChild(mkTab(ax));});
addGroup('Lanes');
EXTRA.forEach(id=>{const ax=AXES.find(a=>a.id===id);if(ax)tabs.appendChild(mkTab(ax));});
// Deterministic local answerer: learned content is already in the window;
// typed queries route to tools or echo the axis framing (no model in the path).
document.getElementById('send').onclick=()=>{
  const v=inp.value.trim();if(!v)return;inp.value='';
  addMsg(v,'user');
  const cur=AXES.find(a=>a.id===document.querySelector('.tab.active').dataset.ax)||AXES[0];
  const q=v.toLowerCase();
  let reply;
  if(/(competitor|peer|who|leader|rival)/.test(q)){reply='Competitor learning for '+cur.title+' is in the window above (top-10 peers + what CSOAI should adopt). Ask a more specific question or open a tool for live measurement.';}
  else if(/(adopt|improve|learn|copy)/.test(q)){reply='The 5 adoptable improvements for '+cur.title+' are listed in the window above. Each is grounded in a verified peer, doctrine-safe (measurement, not certification).';}
  else if(/(measure|run|test|scan|probe|verify|arena)/.test(q)){reply='Use a tool chip above (e.g. Verify, Arena, GSPC axes, asisecurity.ai). Every measured result is signed evidence, never a certification.';}
  else{reply=cur.title+' axis: '+cur.sub+'. New task = new chat — ask about competitors, what to adopt, or a measurement/verify action.';}
  setTimeout(()=>addMsg(reply,'ag'),300);
};
inp.onkeydown=e=>{if(e.key==='Enter')document.getElementById('send').click();};
switchAxis(AXES.find(a=>a.id==='governance')||AXES[0]);
</script>
