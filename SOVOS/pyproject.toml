[project]
name = "sovos"
version = "0.2.0"
description = "SOVOS — the first governance operating system for AI. Task-vector composition over software architecture. 17 packages, 119 tests, 8 mathematical weapons."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "CSOAI Ltd", email = "governance@csoai.org" }]
requires-python = ">=3.10"
keywords = ["governance", "compliance", "ai", "merging", "sovereign", "task-vector", "monorepo"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pydantic>=2.0",
    "httpx>=0.25",
    "pynacl>=1.5",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pyyaml>=6.0",
    "click>=8.1",
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
core = [
    "sovos-core",
    "sovos-mind",
    "sovos-jspace-hyperbolic",
    "sovos-jspace-pipeline",
    "sovos-jspace-move",
]
geometry = ["sovos-info-geometry"]
quantum = [
    "sovos-quantum-bridge",
    "sovos-quantum-router",
    "sovos-qtask-converter",
]
governance = [
    "sovos-cpo-calculator",
    "sovos-certification-loop",
    "sovos-alchemist",
    "sovos-stigmergy",
    "sovos-alphabet",
]
agents = [
    "sovos-a2a-swarm",
]
mcp = [
    "sovos-mcp-injection-scanner",
    "sovos-csoai-governance-crosswalk-mcp",
    "sovos-eu-ai-act-mcp",
    "sovos-openmoe-bft",
    "sovos-sov33-benchmark",
]
gpu = ["torch", "geomstats", "pennylane", "ot"]
dev = ["pytest>=7.0", "pytest-cov"]
all = [
    "sovos-core", "sovos-mind",
    "sovos-jspace-hyperbolic", "sovos-jspace-pipeline", "sovos-jspace-move",
    "sovos-info-geometry",
    "sovos-quantum-bridge", "sovos-quantum-router", "sovos-qtask-converter",
    "sovos-cpo-calculator", "sovos-certification-loop",
    "sovos-alchemist", "sovos-stigmergy", "sovos-alphabet",
    "sovos-a2a-swarm",
    "sovos-mcp-injection-scanner", "sovos-csoai-governance-crosswalk-mcp",
    "sovos-eu-ai-act-mcp", "sovos-openmoe-bft", "sovos-sov33-benchmark",
]

[project.urls]
Homepage = "https://csoai.org"
Repository = "https://github.com/CSOAI-ORG/SOVOS"
Paper = "https://arxiv.org/abs/2608.SOVOS"
Sovereign = "https://csoai.org/sovereign"

# All 21 packages as explicit paths (setuptools doesn't support globs)
[tool.setuptools.packages.find]
where = [
    "packages/sovos-core/src",
    "packages/sovos-mind/src",
    "packages/sovos-jspace-hyperbolic/src",
    "packages/sovos-jspace-pipeline/src",
