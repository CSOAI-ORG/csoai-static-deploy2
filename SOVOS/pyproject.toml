    "sovos-dream = { include = [\"sovos-dream*\"], from = \"src\" }",
    "sovos-families = { include = [\"sovos-families*\"], from = \"src\" }",
    "sovos-fisher-rao = { include = [\"sovos-fisher-rao*\"], from = \"src\" }",
    "sovos-fleet = { include = [\"sovos-fleet*\"], from = \"src\" }",
