[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sovos"
version = "0.3.0"
description = "SOVOS — the first governance operating system for AI. 47 packages."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "CSOAI Ltd", email = "governance@csoai.org" }]
requires-python = ">=3.10"
keywords = ["governance", "compliance", "ai", "merging", "sovereign", "task-vector", "monorepo"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pydantic>=2.0",
    "httpx>=0.25",
    "pynacl>=1.5",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "requests>=2.31",
]

[project.optional-dependencies]
geometry = ["geomstats>=2.6"]
quantum = ["pennylane>=1.30"]
governance = ["pynacl>=1.5", "cryptography>=41"]
agents = ["pyautogen>=0.2"]
mcp = ["mcp>=1.0"]
all = [
    "geomstats>=2.6",
    "pennylane>=1.30",
    "pynacl>=1.5",
    "cryptography>=41",
    "pyautogen>=0.2",
    "mcp>=1.0",
    "fakeredis>=2.20",
]

[tool.setuptools]
packages = [
    "sovos-a2a-swarm = { include = [\"sovos-a2a-swarm*\"], from = \"src\" }",
    "sovos-alchemist = { include = [\"sovos-alchemist*\"], from = \"src\" }",
    "sovos-alphabet = { include = [\"sovos-alphabet*\"], from = \"src\" }",
    "sovos-arena = { include = [\"sovos-arena*\"], from = \"src\" }",
    "sovos-article-zero = { include = [\"sovos-article-zero*\"], from = \"src\" }",
    "sovos-birth = { include = [\"sovos-birth*\"], from = \"src\" }",
    "sovos-bus-redis = { include = [\"sovos-bus-redis*\"], from = \"src\" }",
    "sovos-capability-registry = { include = [\"sovos-capability-registry*\"], from = \"src\" }",
    "sovos-cellar-ingest = { include = [\"sovos-cellar-ingest*\"], from = \"src\" }",
    "sovos-certification-loop = { include = [\"sovos-certification-loop*\"], from = \"src\" }",
    "sovos-chain = { include = [\"sovos-chain*\"], from = \"src\" }",
    "sovos-city = { include = [\"sovos-city*\"], from = \"src\" }",
    "sovos-core = { include = [\"sovos-core*\"], from = \"src\" }",
    "sovos-council = { include = [\"sovos-council*\"], from = \"src\" }",
    "sovos-cpo-calculator = { include = [\"sovos-cpo-calculator*\"], from = \"src\" }",
