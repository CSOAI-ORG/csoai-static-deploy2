[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sovos-signal-index"
version = "0.1.0"
description = "SOV signal index — precision-weighted aggregate of constituent measurement scores"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24"]

[tool.setuptools.packages.find]
where = ["src"]
