# sovos.yaml — serverless deployment manifest for mcp-governance-crosswalk
name: mcp-governance-crosswalk
type: mcp-server
version: 0.4.0
protocols:
  - mcp
  - http

source:
  pypi: csoai-governance-crosswalk-mcp
  github: CSOAI-ORG/governance-crosswalk-mcp

serverless:
  provider: cloudflare-workers
  min_instances: 0
  max_instances: 100

container:
  image: csoai/mcp-governance-crosswalk:latest
  port: 3001

dependencies:
  - sovos-core
  - sovos-signal

governance:
  sov_min: 0.85
  axes:
    GOV: 0.92
    CARE: 0.85