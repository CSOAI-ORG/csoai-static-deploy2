<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SOV Space — Sovereign World</title>
<meta name="description" content="A cinema-grade sovereign 3D world. SOV33 lives in the window and flies it for you. Client-GPU WebGL — free, forever.">
<style>
 html,body{margin:0;height:100%;background:#01030a;overflow:hidden;font-family:-apple-system,system-ui,sans-serif;color:#eee}
 #c{display:block;width:100vw;height:100vh}
 #load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:99;background:#01030a;color:#e6c766;font:600 14px ui-monospace,monospace;letter-spacing:.1em}
 .glass{position:fixed;z-index:20;background:rgba(8,11,20,.58);border:1px solid rgba(201,168,76,.28);border-radius:14px;backdrop-filter:blur(16px) saturate(1.25);-webkit-backdrop-filter:blur(16px) saturate(1.25);box-shadow:0 14px 44px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.08)}
 .glass::before{content:"";position:absolute;left:0;right:0;top:0;height:1.5px;border-radius:14px 14px 0 0;background:linear-gradient(90deg,transparent,#e6c766,#8fd0c0,#c7a8e0,transparent);opacity:.5;pointer-events:none}
 #title h1,#dhead span,#panel h2{background:linear-gradient(96deg,#e6c766,#f0e0a8 32%,#9fd6c4 58%,#d8b8e8 80%,#e6c766);-webkit-background-clip:text;background-clip:text;color:transparent}
 #title{top:16px;left:16px;padding:12px 16px;max-width:330px}
 #title h1{margin:0 0 3px;font-size:16px;color:#e6c766;letter-spacing:.02em}#title p{margin:0;font-size:12px;color:#b9ad8e;line-height:1.4}
 #live{top:16px;right:16px;padding:9px 13px;font:600 11.5px ui-monospace,monospace}#live .d{display:inline-block;width:7px;height:7px;border-radius:50%;background:#1db974;box-shadow:0 0 8px #1db974;margin-right:6px}#live b{color:#e6c766}
 /* sovereign dock — the TUI carried from MEOK OS, but SOV33 flies the world */
 #dock{right:16px;bottom:16px;width:min(380px,92vw);max-height:60vh;display:flex;flex-direction:column;padding:0;overflow:hidden}
 #dhead{display:flex;align-items:center;gap:8px;padding:11px 14px;background:linear-gradient(135deg,#1a1410,#3a2e1a);color:#e6c766;font-weight:700;font-size:14px}
 #log{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px;font-size:13.5px}
 .msg{padding:8px 11px;border-radius:11px;max-width:90%;line-height:1.45}.ai{background:rgba(201,168,76,.14);color:#f0e6cf;align-self:flex-start}.me{background:#c9a84c;color:#1a1410;align-self:flex-end}
 #bar{display:flex;gap:6px;padding:10px;border-top:1px solid rgba(201,168,76,.25)}#bar input{flex:1;background:rgba(0,0,0,.3);border:1px solid rgba(201,168,76,.3);border-radius:999px;padding:9px 14px;color:#f0e6cf;font:14px inherit;outline:none}#bar button{border:0;background:#c9a84c;color:#1a1410;width:38px;border-radius:50%;font-weight:800;cursor:pointer}
</style></head><body>
<div id="load">🜏 waking the sovereign world…</div>
<canvas id="c"></canvas>
<div id="title" class="glass"><h1>🜏 SOV Space — Sovereign World</h1><p>SOV33 is in this window. Ask it to fly anywhere — "take me to Tokyo", "show London". Cinema WebGL on <b>your</b> GPU, free.</p></div>
<div id="live" class="glass"><span class="d"></span><span id="lt">connecting…</span></div>
<div id="nav" class="glass" style="top:16px;left:50%;transform:translateX(-50%);padding:5px;display:flex;gap:4px">
 <button data-f="world" class="nb">🌍 World</button><button data-f="jspace" class="nb">🧠 J-Space</button><button data-f="agents" class="nb">🤝 Agents</button></div>
<div id="panel" class="glass" style="left:16px;bottom:16px;width:min(360px,90vw);max-height:64vh;overflow:auto;padding:14px 16px;display:none;font-size:13px;line-height:1.5"></div>
<style>.nb{border:0;background:transparent;color:#c9b98a;font:600 12px system-ui;padding:6px 12px;border-radius:9px;cursor:pointer}.nb.on{background:#c9a84c;color:#1a1410}#panel h2{margin:0 0 6px;font-size:15px;color:#e6c766}#panel h4{margin:10px 0 3px;color:#e6c766;font-size:12.5px}#panel code{background:rgba(201,168,76,.12);padding:1px 5px;border-radius:5px;font-size:11.5px}#panel .hon{color:#c99a6a;font-size:11.5px;font-style:italic}</style>
<div id="dock" class="glass"><div id="dhead">🐉 <span>Sovereign</span></div><div id="log"></div><div id="bar"><input id="qin" placeholder="tell the sovereign where to go…" autocomplete="off"><button id="go">➤</button></div></div>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
const IMG='https://unpkg.com/three-globe/example/img/';
const tl=new THREE.TextureLoader(); tl.crossOrigin='anonymous';
const scene=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,0.01,2000); cam.position.set(0,1.4,6.2);
const rndr=new THREE.WebGLRenderer({canvas:c,antialias:true,logarithmicDepthBuffer:true});
rndr.setSize(innerWidth,innerHeight); rndr.setPixelRatio(Math.min(devicePixelRatio,2)); rndr.toneMapping=THREE.ACESFilmicToneMapping; rndr.toneMappingExposure=1.15;
const ctr=new OrbitControls(cam,rndr.domElement); ctr.enableDamping=true; ctr.dampingFactor=.06; ctr.minDistance=2.6; ctr.maxDistance=22; ctr.autoRotate=true; ctr.autoRotateSpeed=.18;
// sun
const sun=new THREE.DirectionalLight(0xfff2d8,3.2); sun.position.set(-6,2.5,4); scene.add(sun); scene.add(new THREE.AmbientLight(0x223355,.35));
// starfield
const sg=new THREE.BufferGeometry(),sp=[];for(let i=0;i<5000;i++){const r=90+Math.random()*400,t=Math.random()*6.283,p=Math.acos(2*Math.random()-1);sp.push(r*Math.sin(p)*Math.cos(t),r*Math.sin(p)*Math.sin(t),r*Math.cos(p));}
sg.setAttribute('position',new THREE.Float32BufferAttribute(sp,3));scene.add(new THREE.Points(sg,new THREE.PointsMaterial({color:0x93a7d6,size:.5,transparent:true,opacity:.85})));
// EARTH (day + night lights + specular oceans + bump)
const R=2;
const earth=new THREE.Mesh(new THREE.SphereGeometry(R,96,96),new THREE.MeshPhongMaterial({
  map:tl.load(IMG+'earth-blue-marble.jpg'), bumpMap:tl.load(IMG+'earth-topology.png'), bumpScale:.04,
  specularMap:tl.load(IMG+'earth-water.png'), specular:new THREE.Color(0x335577), shininess:16,
  emissiveMap:tl.load(IMG+'earth-night.jpg'), emissive:new THREE.Color(0xffd27f), emissiveIntensity:1.05 }));
scene.add(earth);
// clouds
const clouds=new THREE.Mesh(new THREE.SphereGeometry(R*1.01,96,96),new THREE.MeshLambertMaterial({map:tl.load(IMG+'clouds.png'),transparent:true,opacity:.4,depthWrite:false})); scene.add(clouds);
// atmosphere (fresnel rim glow)
const atm=new THREE.Mesh(new THREE.SphereGeometry(R*1.16,96,96),new THREE.ShaderMaterial({side:THREE.BackSide,transparent:true,
  uniforms:{c:{value:new THREE.Color(0x3d7bff)}},
  vertexShader:'varying vec3 vN;void main(){vN=normalize(normalMatrix*normal);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
  fragmentShader:'varying vec3 vN;uniform vec3 c;void main(){float i=pow(.72-dot(vN,vec3(0,0,1.)),3.);gl_FragColor=vec4(c,i*1.1);}'})); scene.add(atm);
// hive markers on the globe
const GAZ={london:[51.51,-0.13],'new york':[40.71,-74.0],newyork:[40.71,-74.0],tokyo:[35.68,139.69],singapore:[1.35,103.82],dubai:[25.2,55.27],frankfurt:[50.11,8.68],sydney:[-33.87,151.21],'san francisco':[37.77,-122.42],paris:[48.86,2.35],mumbai:[19.08,72.88],'hong kong':[22.32,114.17],toronto:[43.65,-79.38],washington:[38.9,-77.04],berlin:[52.52,13.4],geneva:[46.2,6.14],brussels:[50.85,4.35]};
function llToVec(lat,lon,rad){const p=(90-lat)*Math.PI/180,t=(lon+180)*Math.PI/180;return new THREE.Vector3(-rad*Math.sin(p)*Math.cos(t),rad*Math.cos(p),rad*Math.sin(p)*Math.sin(t));}
fetch('/api/nodes').then(r=>r.json()).then(d=>{(d.nodes||[]).forEach(n=>{const g=GAZ[(n.id||'').toLowerCase()];if(!g)return;const col=n.status==='governed'?0x5fe0b0:0xd47a5a;const m=new THREE.Mesh(new THREE.SphereGeometry(.03,16,16),new THREE.MeshBasicMaterial({color:col}));m.position.copy(llToVec(g[0],g[1],R*1.01));earth.add(m);const beam=new THREE.Mesh(new THREE.CylinderGeometry(.006,.02,.16,8),new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:.55}));beam.position.copy(llToVec(g[0],g[1],R*1.08));beam.lookAt(0,0,0);beam.rotateX(Math.PI/2);earth.add(beam);});}).catch(()=>{});
// post: bloom for the cinema glow
const comp=new EffectComposer(rndr); comp.addPass(new RenderPass(scene,cam));
const bloom=new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),.7,.6,.85); comp.addPass(bloom);
// SOV33 flies the world (agentic). "take me to X" -> rotate earth so X faces camera + zoom
function say(w,h){const m=document.createElement('div');m.className='msg '+w;m.innerHTML=h;log.appendChild(m);log.scrollTop=log.scrollHeight;return m;}
let targetQuat=null,zoom=null;
function flyTo(lat,lon){ctr.autoRotate=false;const v=llToVec(lat,lon,1).normalize();const q=new THREE.Quaternion().setFromUnitVectors(v,new THREE.Vector3(0,0,1));targetQuat=q;zoom=3.1;}
async function ask(v){say('me',v.replace(/</g,'&lt;'));const t=say('ai','…');
  const place=Object.keys(GAZ).find(k=>v.toLowerCase().includes(k));
  if(place){flyTo(GAZ[place][0],GAZ[place][1]);t.innerHTML='Flying you to <b>'+place.replace(/\b\w/g,c=>c.toUpperCase())+'</b> 🜏';}
  else{try{const d=await(await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:v,register:'plain'})})).json();t.innerHTML=(d.response||'On it.').replace(/</g,'&lt;');}catch(_){t.innerHTML='I fly this world for you — name a place and I take you there.';}}}
go.onclick=()=>{const v=qin.value.trim();if(v){qin.value='';ask(v);}}; qin.addEventListener('keydown',e=>{if(e.key==='Enter')go.onclick();});
setTimeout(()=>say('ai','I am the Sovereign, and this world is mine to fly. Tell me where — "take me to Tokyo".'),600);
// live HUD
async function poll(){let a='';try{const e=await(await fetch('/api/emergence')).json();a='emergence <b>'+(e.tick||'—')+'</b>';}catch(_){a='emergence —';}try{const s=await(await fetch('/api/trust/score/MEOK%20Sovereign%23default')).json();a+=' · trust <b>'+s.tier+'</b>';}catch(_){}lt.innerHTML=a;}poll();setInterval(poll,15000);
// THREE FACES of SOV Space: inward J-Space · outward World · lateral Agents (one space, one seam)
let SS=null; fetch('/api/sovspace').then(r=>r.json()).then(d=>SS=d).catch(()=>{});
const panel=document.getElementById('panel');
async function showFace(f){
  document.querySelectorAll('.nb').forEach(b=>b.classList.toggle('on',b.dataset.f===f));
  if(f==='world'){panel.style.display='none';return;}
  panel.style.display='block'; if(!SS){panel.innerHTML='loading…';return;}
  if(f==='jspace'){
    let led='';try{const e=await(await fetch('/api/emergence')).json();led=e.latest?('tick <b>'+e.tick+'</b> · '+e.latest.proposal+' · '+e.latest.votes+(e.latest.ratified?' ✓':' ✗')):'(waking)';}catch(_){led='(waking)';}
    panel.innerHTML='<h2>🧠 J-Space — SOV33, inward</h2><div>'+SS.faces.jspace.what+'</div>'+
      '<h4>Instruments (functional correlates)</h4>'+SS.faces.jspace.instruments.map(i=>'• '+i).join('<br>')+
      '<h4>Emergence (live, self-improving)</h4>'+led+
      '<p class="hon">'+SS.faces.jspace.honest+'</p>';
  } else if(f==='agents'){
    const s=SS.seam.commands.map(c=>'<code>'+c+'</code>').join(' ');
    panel.innerHTML='<h2>🤝 Agents — lateral, they plug in</h2><div>'+SS.faces.agents.what+'</div>'+
      '<h4>Connect</h4>• A2A card: <code>/api/agentcard</code><br>• MCP seam: <code>/api/mcp</code><br>• Hatch: <code>/api/hatch</code>'+
      '<h4>The command seam (every body obeys)</h4>'+s+
      '<p class="hon">'+SS.seam.note+'</p>';
  }
}
document.querySelectorAll('.nb').forEach(b=>b.onclick=()=>showFace(b.dataset.f)); showFace('world');
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();rndr.setSize(innerWidth,innerHeight);comp.setSize(innerWidth,innerHeight);});
let started=false;
(function loop(){requestAnimationFrame(loop);clouds.rotation.y+=.0004;
 if(targetQuat){earth.quaternion.slerp(targetQuat,.05);if(zoom){cam.position.setLength(THREE.MathUtils.lerp(cam.position.length(),zoom,.04));}}
 if(!started&&earth.material.map&&earth.material.map.image){started=true;load.style.display='none';}
 ctr.update();comp.render();})();
</script>
</body></html>
