// =========================================================================
// THREE.JS SCENE
// =========================================================================
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x03060c, 0.012);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 500);
camera.position.set(0, 12, 28);

const ambient = new THREE.AmbientLight(0x4488aa, 0.6);
scene.add(ambient);
const sun = new THREE.PointLight(0x22d3ee, 2, 80);
sun.position.set(8, 12, 0);
scene.add(sun);
const accent = new THREE.PointLight(0xf59e0b, 1.5, 60);
accent.position.set(-10, -5, 8);
scene.add(accent);

// =========================================================================
// BFT COUNCIL (33 agents at the center)
// =========================================================================
const councilGroup = new THREE.Group();
const councilAgents = [];
for (let i = 0; i < 33; i++) {
  const phi = Math.acos(1 - 2 * (i + 0.5) / 33);
  const theta = Math.PI * (1 + Math.sqrt(5)) * i;
  const r = 4;
  const x = r * Math.sin(phi) * Math.cos(theta);
  const y = r * Math.sin(phi) * Math.sin(theta);
  const z = r * Math.cos(phi);
  const geo = new THREE.SphereGeometry(0.18, 12, 12);
  const mat = new THREE.MeshBasicMaterial({ color: 0x34d399 });
  const agent = new THREE.Mesh(geo, mat);
  agent.position.set(x, y, z);
  agent.userData = { kind: 'agent', index: i };
  councilAgents.push(agent);
  councilGroup.add(agent);
}
scene.add(councilGroup);

// Council center (the seat of power)
const throneGeo = new THREE.IcosahedronGeometry(0.7, 1);
const throneMat = new THREE.MeshPhongMaterial({
  color: 0x22d3ee, emissive: 0x22d3ee, emissiveIntensity: 0.3, wireframe: false
});
const throne = new THREE.Mesh(throneGeo, throneMat);
scene.add(throne);
const throneWire = new THREE.Mesh(
  new THREE.IcosahedronGeometry(0.95, 1),
  new THREE.MeshBasicMaterial({ color: 0x22d3ee, wireframe: true })
);
scene.add(throneWire);

// =========================================================================
// 41 CHARTER ORBS (in a Fibonacci sphere around the council)
// =========================================================================
const charterGroup = new THREE.Group();
const charterMeshes = [];
const charterLineGroup = new THREE.Group();
const CHARTERS = CHARTERS_DATA;

CHARTERS.forEach((c, i) => {
  // Fibonacci sphere layout
  const phi = Math.acos(1 - 2 * (i + 0.5) / CHARTERS.length);
  const theta = Math.PI * (1 + Math.sqrt(5)) * i;
  const r = 12 + (i % 3) * 0.8;
  const x = r * Math.sin(phi) * Math.cos(theta);
  const y = r * Math.sin(phi) * Math.sin(theta);
  const z = r * Math.cos(phi);
  // Orb size: bigger if it passed unanimously
  const size = 0.3 + (c.votes_for / 33) * 0.4;
  const geo = new THREE.SphereGeometry(size, 16, 16);
  // Color: gold if 33/33, red if not
  const isUnanimous = c.votes_for === 33 && c.votes_against === 0;
  const color = isUnanimous ? 0xf59e0b : 0xfb7185;
  const mat = new THREE.MeshPhongMaterial({
    color, emissive: color, emissiveIntensity: 0.5
  });
  const orb = new THREE.Mesh(geo, mat);
  orb.position.set(x, y, z);
  orb.userData = { kind: 'charter', charter: c, index: i };
  charterMeshes.push(orb);
  charterGroup.add(orb);
  // Line from charter to council (the OTS anchor link)
  const lineGeo = new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(x, y, z),
    new THREE.Vector3(0, 0, 0)
  ]);
  const lineMat = new THREE.LineBasicMaterial({
    color: 0xf59e0b, transparent: true, opacity: 0.18
  });
  const line = new THREE.Line(lineGeo, lineMat);
  charterLineGroup.add(line);
});
scene.add(charterGroup);
scene.add(charterLineGroup);

// =========================================================================
// STARFIELD
// =========================================================================
const starGeo = new THREE.BufferGeometry();
const starVerts = [];
for (let i = 0; i < 2000; i++) {
  starVerts.push((Math.random() - 0.5) * 200, (Math.random() - 0.5) * 200, (Math.random() - 0.5) * 200);
}
starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starVerts, 3));
const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.06, transparent: true, opacity: 0.6 });
scene.add(new THREE.Points(starGeo, starMat));

// =========================================================================
// INTERACTION
// =========================================================================
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
let selected = null;
let cameraAutoRotate = true;
let orbitTheta = 0;

canvas.addEventListener('click', (event) => {
  mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  // Check charter orbs first, then council agents
  const allMeshes = [...charterMeshes, ...councilAgents];
  const intersects = raycaster.intersectObjects(allMeshes);
  if (intersects.length > 0) {
    const obj = intersects[0].object;
    selected = obj;
    showInfo(obj);
  } else {
    selected = null;
    showEmpty();
  }
});

// Camera orbit controls (drag to rotate)
let isDragging = false;
let lastX = 0, lastY = 0;
canvas.addEventListener('mousedown', (e) => { isDragging = true; lastX = e.clientX; lastY = e.clientY; cameraAutoRotate = false; document.getElementById('toggle-rotation').checked = false; });
canvas.addEventListener('mousemove', (e) => { if (isDragging) { orbitTheta += (e.clientX - lastX) * 0.005; camera.position.y += (lastY - e.clientY) * 0.02; lastX = e.clientX; lastY = e.clientY; } });
canvas.addEventListener('mouseup', () => { isDragging = false; });

// =========================================================================
// INFO PANE
// =========================================================================
function showEmpty() {
  document.getElementById('info-content').innerHTML = '<div class="empty">Click any charter orb to inspect its ratification record.</div>';
}
function showInfo(obj) {
  const u = obj.userData;
  if (u.kind === 'charter') {
    const c = u.charter;
    const isUnanimous = c.votes_for === 33 && c.votes_against === 0;
    document.getElementById('info-content').innerHTML =
      '<h3>' + (isUnanimous ? '✅ ' : '⚠️ ') + c.name + '-charter</h3>' +
      '<div class="meta">' +
        '<b>#' + c.num + '</b> · ' + c.proposal_id + '<br>' +
        'ratified <b>' + c.date + '</b> · quorum <b>' + c.quorum + '</b><br>' +
        'votes: <b>' + c.votes_for + '</b> for / <b>' + c.votes_against + '</b> against / <b>' + c.abstain + '</b> abstain<br>' +
        'OTS anchor: <b>' + c.ots_anchor + '</b>' +
      '</div>' +
      '<div class="notes">' + c.notes + '</div>' +
      '<div class="sig">SIGIL: ' + c.sigil + '</div>';
  } else if (u.kind === 'agent') {
    document.getElementById('info-content').innerHTML =
      '<h3>BFT Council Agent #' + (u.index + 1) + '</h3>' +
      '<div class="meta">33-agent Byzantine Fault Tolerant council.<br>Quorum: <b>23/33</b> standard, <b>27/33</b> supermajority, <b>33/33</b> Article 0.</div>' +
      '<div class="notes">Each agent is an independent, geographically distributed, cryptographically attested entity. This is one of 33 — they vote on every charter ratification.</div>';
  }
}

// =========================================================================
// LAYER TOGGLES
// =========================================================================
document.getElementById('toggle-charters').addEventListener('change', (e) => { charterGroup.visible = e.target.checked; charterLineGroup.visible = e.target.checked && document.getElementById('toggle-connections').checked; });
document.getElementById('toggle-council').addEventListener('change', (e) => { councilGroup.visible = e.target.checked; throne.visible = e.target.checked; throneWire.visible = e.target.checked; });
document.getElementById('toggle-connections').addEventListener('change', (e) => { charterLineGroup.visible = e.target.checked; });
document.getElementById('toggle-rotation').addEventListener('change', (e) => { cameraAutoRotate = e.target.checked; });

// Show controls after loading
setTimeout(() => { document.getElementById('controls').classList.remove('hidden'); }, 500);

// =========================================================================
// ANIMATION LOOP
// =========================================================================
function animate() {
  requestAnimationFrame(animate);
  if (cameraAutoRotate) {
    orbitTheta += 0.002;
  }
  // Camera orbits at fixed radius
  const radius = 28;
  camera.position.x = Math.sin(orbitTheta) * radius;
  camera.position.z = Math.cos(orbitTheta) * radius;
  camera.lookAt(0, 0, 0);
  // Charter pulse (selected one is bigger)
  charterMeshes.forEach((m, i) => {
    const baseScale = (m.userData.charter.votes_for / 33) * 0.5 + 0.5;
    const t = Date.now() * 0.001 + i * 0.3;
    const pulse = 1 + Math.sin(t) * 0.05;
    m.scale.setScalar(baseScale * pulse * (selected === m ? 1.5 : 1));
  });
  // Throne rotation
  throne.rotation.y += 0.005;
  throneWire.rotation.y -= 0.008;
  renderer.render(scene, camera);
}
animate();

// =========================================================================
// RESIZE
// =========================================================================
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// =========================================================================
// STATS UPDATE
// =========================================================================
const avgQuorum = CHARTERS.reduce((s, c) => s + c.votes_for, 0) / (CHARTERS.length * 33) * 100;
document.getElementById('stat-quorum').textContent = avgQuorum.toFixed(1) + '%';
document.getElementById('stat-charters').textContent = CHARTERS.length;
document.getElementById('loading').style.display = 'none';
</script>
