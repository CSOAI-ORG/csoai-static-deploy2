name: Canon drift-guard
# Fails any build whose public axis count drifts from the ruled number.
# The ruled public framing: "13 measured of 14 quotable" (GSPC ruling 2026-08-18).
# This is the integrity fix that stops the axis-count crack silently reappearing.
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
jobs:
  canon-count:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the axis count never drifts from the ruling
        run: |
          set -e
          RULED="13 measured of 14"
          # The signed living board must exist and carry the ruled framing.
          if ! grep -rqi "13 measured of 14" SOVOS/ _site/ 2>/dev/null; then
            echo "::error:: Ruled framing '$RULED' not found in repo — canon drift detected"
            exit 1
          fi
          # No forbidden axis counts may appear in public copy.
          if grep -rEqi '16 measured|17 measured|"16 axes"|"17 axes"|30 frameworks' _site/ SOVOS/*.md 2>/dev/null; then
            echo "::error:: Forbidden axis count found (16/17 measured or 30 frameworks) — canon drift"
            exit 1
          fi
          echo "Canon count OK: $RULED"
