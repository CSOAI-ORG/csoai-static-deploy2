name: CSOAI CI — Alignment Pipeline
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python3 -m pip install --quiet cryptography
      - name: Syntax check Python files
        run: |
          python3 -m py_compile sovereign_api.py
          python3 -m py_compile sov_invariants.py
          python3 -m py_compile sov4_router.py
          python3 -m py_compile sov6_stack.py
          python3 -m py_compile sov_orchestrator.py
          python3 -m py_compile govbench_eval.py
          python3 -m py_compile eat_govbench.py
      - name: Run runtime alignment tests
        run: python3 -m unittest test_sov_runtime_alignment.py -v
      - name: Verify capability registry
        run: python3 tools/verify_capability_registry.py
      - name: Run capability assertions
        run: python3 tools/capability_assert.py
      - name: Run orchestrator health check
        run: python3 sov_orchestrator.py
      - name: Run decision_ledger selftest
        run: python3 decision_ledger.py --selftest
      - name: Run sov_instrument selftest
        run: python3 sov_instrument.py --selftest

  bloodline-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check bloodline
        run: |
          python3 - <<'PY'
          import json, os
          path = 'eat_results/bloodline.json'
          if os.path.exists(path):
              b = json.load(open(path))
              count = len(b.get('knowledge', b))
              print(f'Bloodline: {count} entries')
              assert count >= 50, f'Bloodline too sparse: {count}'
          else:
              print('Bloodline file not found — check eat_results/ later')
          PY

  visual-mind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: jspace_chess selftest (J-Space board core)
        run: python3 jspace_chess.py --selftest
      - name: jspace_cards selftest (KB -> deck derivation)
        run: python3 jspace_cards.py --selftest
      - name: EAT pipeline selftest (integrity gate)
        run: python3 overnight_eat.py --selftest
      - name: flywheel selftest (anti-Goodhart)
        run: python3 flywheel.py --selftest

  govbench:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: python3 -m pip install --quiet requests
      - name: Run GovBench evaluation
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: python3 govbench_eval.py --all
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: govbench-results
          path: benchmark-results/govbench/
