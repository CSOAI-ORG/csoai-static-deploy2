name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Python syntax check
        run: |
          python -m py_compile test_sov_runtime_alignment.py
          python -m py_compile tools/verify_capability_registry.py
          python -m py_compile tools/capability_assert.py
          python -m py_compile sov_invariants.py
          python -m py_compile sovereign_api.py
          python -m py_compile sov4_router.py
          python -m py_compile sov6_stack.py

      - name: Runtime alignment tests
        run: python3 -m unittest test_sov_runtime_alignment.py -v

      - name: Verify capability registry
        run: python3 tools/verify_capability_registry.py

      - name: Run capability assertions
        run: python3 tools/capability_assert.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          pip install -r requirements.txt

      - name: Lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --max-complexity=10 --max-line-length=127 --statistics

  broken-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check broken links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --exclude 'localhost|127\.0\.0\.1|\.vercel' '**/*.md' '**/*.html'

  deploy:
    if: github.ref == 'refs/heads/main' && secrets.VERCEL_TOKEN != ''
    needs: [test, lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Deploy to Vercel
        run: |
          vercel --token ${{ secrets.VERCEL_TOKEN }} --prod --yes
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
