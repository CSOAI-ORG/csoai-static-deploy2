# GovBench eval-as-code gate (the Ori Eval pattern applied to our own benchmark).
# Layer 1 (deterministic invariants) runs on every push — no secrets, no network — and blocks a
# merge that breaks the scorer, changes the item set without re-pinning, or lets a statute-blind
# strategy start winning (i.e. the benchmark stopped discriminating). Layer 2 (live model rows)
# runs on a schedule when a provider key exists, so a new model is re-measured without hand-work.
name: GovBench board gate

on:
  push:
    paths:
      - "board_ci.py"
      - "openrouter_board.py"
      - "board_items_govbench.json"
      - ".github/workflows/govbench-board.yml"
  pull_request:
  schedule:
    - cron: "17 6 * * 1"   # weekly re-measure (Layer 2) — cheap, catches "a new model shipped"
  workflow_dispatch:

jobs:
  invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Layer 1 — deterministic benchmark-integrity gate (no network)
        run: python3 board_ci.py

  model-rows:
    # only on schedule/dispatch, and only if a key is present — never fails the build for want of a key
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    needs: invariants
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Layer 2 — live model rows (skips cleanly if no key)
        env:
          # add lab keys as repo secrets; each provider self-skips when its key is absent
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
        run: |
          # board_ci reads keys from .env; export env into a throwaway .env for the run
          { echo "GEMINI_API_KEY=$GEMINI_API_KEY";
            echo "DEEPSEEK_API_KEY=$DEEPSEEK_API_KEY";
            echo "MOONSHOT_API_KEY=$MOONSHOT_API_KEY"; } > .env
          python3 board_ci.py --with-models
          rm -f .env
