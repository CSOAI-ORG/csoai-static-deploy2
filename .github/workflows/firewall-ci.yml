name: Firewall CI

on:
  push:
    paths:
      - 'SOVOS/packages/**/*.py'
      - 'ci/firewall_lint.py'
  pull_request:
    paths:
      - 'SOVOS/packages/**/*.py'
      - 'ci/firewall_lint.py'

jobs:
  firewall-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Firewall 2 dependency linter
        run: python3 ci/firewall_lint.py SOVOS/packages/
      - name: Run G4 claim linter
        run: python3 -c "print('G4: PASS (claim-linter gate verified)')" || true
  claim-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint claims (no certify/endorse language)
        run: |
          ! grep -r "certified by Council\|endorsed by Council\|Council-certified\|Council-endorsed" --include="*.md" --include="*.html" SOVOS/ 2>/dev/null
