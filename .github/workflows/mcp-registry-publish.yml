name: mcp-registry-publish

# Publishes CSOAI MCP servers to the official MCP registry (registry.modelcontextprotocol.io)
# Canon: registry/*.json must validate with `mcp-publisher validate`.
# Trigger: on push to main touching registry/*.json (plus manual dispatch).

on:
  push:
    branches: [main]
    paths: ["registry/*.json"]
  workflow_dispatch:

jobs:
  validate-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Install publisher CLI
        run: |
          set -e
          # Strategy (mcp-publisher v1.8.1, per Homebrew formula):
          #   1. Prebuilt x86_64_linux Homebrew bottle from ghcr.io (no Go build needed)
          #   2. Fallback: go build from the v1.8.1 source tarball (the formula builds ./cmd/publisher)
          BOTTLE_SHA256="ec4115143e7155829f3f8cfea82db317c21b73238c8852234b59a14df7b6e3a1"
          BOTTLE="https://ghcr.io/v2/homebrew/core/mcp-publisher/blobs/sha256:${BOTTLE_SHA256}"
          echo ":: Trying prebuilt bottle..."
          if curl -sSfL --retry 2 -o /tmp/pub.tar.gz "$BOTTLE" 2>/dev/null && [ -s /tmp/pub.tar.gz ]; then
            echo "  bottle downloaded ($(wc -c < /tmp/pub.tar.gz) B)"
            tar -xzf /tmp/pub.tar.gz -C /tmp 2>/dev/null || true
            BIN=$(find /tmp -type f -name "mcp-publisher" -perm -u+x 2>/dev/null | head -1)
            if [ -n "$BIN" ]; then
              cp "$BIN" /usr/local/bin/mcp-publisher
              echo "  installed bottle to /usr/local/bin/mcp-publisher"
            fi
          else
            echo "  bottle fetch failed; falling back to go build"
          fi
          if ! command -v mcp-publisher >/dev/null 2>&1; then
            echo ":: Building from source (go 1.2x)..."
            go version
            curl -sSfL --retry 2 -o /tmp/pub.go.tar.gz "https://github.com/modelcontextprotocol/registry/archive/refs/tags/v1.8.1.tar.gz"
            tar -xzf /tmp/pub.go.tar.gz -C /tmp
            cd /tmp/registry-1.8.1
            # The Homebrew formula builds ./cmd/publisher -> bin/mcp-publisher (ldflags Version/GitCommit/BuildTime)
            go build -ldflags "-X main.Version=1.8.1" -o /usr/local/bin/mcp-publisher ./cmd/publisher
            echo "  go build OK"
          fi
          mcp-publisher --help | head -1 || true

      - name: Validate all registry entries
        run: |
          for f in registry/*.json; do
            echo "== $f =="
            mcp-publisher validate "$f" || { echo "VALIDATION FAILED: $f"; exit 1; }
          done

      - name: Authenticate with registry (GitHub OIDC)
        run: mcp-publisher login github-oidc

      - name: Publish all registry entries (duplicate-tolerant)
        run: |
          set +e  # GitHub run steps default to bash -e; a non-zero publish must NOT kill the loop
          failures=0
          for f in registry/*.json; do
            echo "== publish $f =="
            OUT=$(mcp-publisher publish "$f" 2>&1)
            if echo "$OUT" | grep -q 'Successfully published'; then
              echo "  ok: $f"
            elif echo "$OUT" | grep -q 'duplicate version'; then
              echo "  skip (already published): $f"
            else
              echo "  FAIL: $f"
              echo "$OUT" | tail -3
              failures=$((failures+1))
            fi
          done
          if [ "$failures" -gt 0 ]; then echo "$failures publish failures"; exit 1; fi