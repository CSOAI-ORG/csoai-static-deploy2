name: mcp-registry-publish

# Publishes CSOAI MCP servers to the official MCP registry (registry.modelcontextprotocol.io)
# via GitHub OIDC — no browser, no stored token, repeatable from any machine/pod.
# Canon: registry/*.json must validate with `mcp-publisher validate`.

on:
  push:
    branches: [main, jv-wave8-production]
    paths: ["registry/*.json"]
  workflow_dispatch: {}

permissions:
  id-token: write   # OIDC for mcp-publisher login github-oidc

jobs:
  validate-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install publisher CLI
        run: |
          # publisher ships in the modelcontextprotocol/registry repo (brew source).
          # Fallback chain: go install → tarball build → error with diagnostics.
          if command -v go >/dev/null 2>&1; then
            go install github.com/modelcontextprotocol/registry/...@v1.8.1
            for p in "$(go env GOPATH)/bin/mcp-publisher" /usr/local/bin/mcp-publisher; do
              [ -x "$p" ] && sudo cp "$p" /usr/local/bin/mcp-publisher && break
            done
          fi
          if ! command -v mcp-publisher >/dev/null 2>&1; then
            curl -sSfL -o /tmp/pub.tar.gz "https://github.com/modelcontextprotocol/registry/archive/refs/tags/v1.8.1.tar.gz"
            tar -xzf /tmp/pub.tar.gz -C /tmp
            cd /tmp/registry-*
            go build -o /usr/local/bin/mcp-publisher ./main/... || \
            { echo "build failed — check repo layout"; exit 1; }
          fi
          mcp-publisher --help | head -1

      - name: Validate all registry entries
        run: |
          for f in registry/*.json; do
            echo "== $f =="
            mcp-publisher validate "$f"
          done

      - name: Authenticate via GitHub OIDC
        run: mcp-publisher login github-oidc

      - name: Publish all registry entries
        run: |
          for f in registry/*.json; do
            echo "== publishing $f =="
            mcp-publisher publish "$f" || echo "publish exit $? (may be version-exists)"
          done