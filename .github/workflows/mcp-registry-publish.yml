name: mcp-registry-publish

# Publishes CSOAI MCP servers to the official MCP registry (registry.modelcontextprotocol.io)
# via GitHub OIDC — no browser, no stored token, repeatable from any machine/pod.
# Canon: registry/*.json must validate with `mcp-publisher validate`.

on:
  push:
    branches: [main, jv-wave8-production]
    paths: ["registry/*.json"]
  workflow_dispatch: {}

permissions:
  id-token: write   # OIDC for mcp-publisher login github-oidc

jobs:
  validate-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install publisher CLI
        run: |
          # Publisher ships via Homebrew bottle in modelcontextprotocol/registry repo (brew source).
          # Order: Homebrew bottle (prebuilt linux binary) → go build → fail with diagnostics.
          BOTTLE="https://ghcr.io/v2/homebrew/core/mcp-publisher/blobs/sha256:ec4115143e7155829f3f8cfea82db317c21b73238c8852234b"
          if curl -sSfL -H "Authorization: Bearer QQ==" -o /tmp/pub.tar.gz "$BOTTLE" 2>/dev/null && [ -s /tmp/pub.tar.gz ]; then
            tar -xzf /tmp/pub.tar.gz -C /tmp 2>/dev/null || true
            find /tmp -type f -name "mcp-publisher" -perm -u+x 2>/dev/null | head -1 | xargs -I{} cp {} /usr/local/bin/mcp-publisher
          fi
          if ! command -v mcp-publisher >/dev/null 2>&1; then
            curl -sSfL -o /tmp/pub.go.tar.gz "https://github.com/modelcontextprotocol/registry/archive/refs/tags/v1.8.1.tar.gz"
            tar -xzf /tmp/pub.go.tar.gz -C /tmp
            # find the actual cmd dir (brew source: cmd/mcp-publisher)
            go build -o /usr/local/bin/mcp-publisher /tmp/registry-*/cmd/mcp-publisher 2>/dev/null || \
            go list -f "{{.ImportPath}}" /tmp/registry-*/... 2>/dev/null | grep -iE "cmd|publisher" | head -3
            { echo "build failed"; exit 1; }
          fi
          mcp-publisher --help | head -1

      - name: Validate all registry entries
        run: |
          for f in registry/*.json; do
            echo "== $f =="
            mcp-publisher validate "$f"
          done

      - name: Authenticate via GitHub OIDC
        run: mcp-publisher login github-oidc

      - name: Publish all registry entries
        run: |
          for f in registry/*.json; do
            echo "== publishing $f =="
            mcp-publisher publish "$f" || echo "publish exit $? (may be version-exists)"
          done