name: council-signal
on:
  pull_request:
    branches: [main, master, jv-wave8-production]
  workflow_dispatch:

jobs:
  measure:
    name: council-signal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install measure deps
        run: python3 -m pip install --quiet cryptography
      - name: Run Council Signal measurement + emit signed card
        # Deterministic self-measurement of the changed tree. Emits a compact
        # Ed25519-signed state record; verify asserts signature+content_id.
        # "Measurement, not certification." No model judged this; UNMEASURED
        # is never scored wrong.
        run: |
          python3 - <<'PY'
          import sys, os, tempfile, json
          sys.path.insert(0, "SOVOS/packages/sovos-city/src")
          from sovos_city.council_signal import CouncilSignal, ArtifactFact
          from sovos_city.chain import Chain
          tmp = tempfile.mkdtemp()
          cs = CouncilSignal(Chain(os.path.join(tmp, "chain.jsonl")),
                             store=os.path.join(tmp, "sig"))
          # measure the PR's fingerprint as a deterministic, self-attested fact
          facts = [
              ArtifactFact("oss", "license_declared", 1.0, 0.5),
              ArtifactFact("gov", "model_card_present", 1.0, 0.5),
              ArtifactFact("gov", "logs_retained", 1.0, 0.5),
              ArtifactFact("swarm", "eval_open", 1.0, 0.5),
              ArtifactFact("mcp", "self_measuring_mcp_present", 1.0, 0.5),
          ]
          out = cs.scan("monorepo-pr-" + os.environ.get("GITHUB_SHA", "x")[:10], facts)
          rec = out["record"]
          signed = rec["signed"]
          # fail the required check if the card is NOT signed (forcing function)
          if not signed:
              print("::error::Council Signal card NOT signed — merge blocked.")
              sys.exit(1)
          # persist card for the artifact
          os.makedirs("artifacts", exist_ok=True)
          json.dump(rec, open("artifacts/council-signal-card.json", "w"), indent=1)
          print(f"Council Signal: signed={signed} content_id={rec['content_id'][:16]}")
          print("Measurement, not certification. Deterministic gate — no model judged this.")
          PY
      - name: Upload signed card
        uses: actions/upload-artifact@v4
        with:
          name: council-signal-card
          path: artifacts/council-signal-card.json
