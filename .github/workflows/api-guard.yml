name: API Stability Guard — /api/* must stay JSON

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 * * * *'   # hourly, off :00
  workflow_dispatch:

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 2026-08-19 (Claude lane): the previous guard asserted /api/tools and
      # /api/mcp — endpoints that never existed in this repo's functions/ tree
      # (a ghost from an older deployment), so it failed hourly forever.
      # Assert the Functions main actually ships: /api/health and /api/leaderboard.
      - name: Check /api/health and /api/leaderboard return JSON with expected shape
        run: |
          set +e
          H=$(curl -sL -o /tmp/api_health.json -w '%{http_code}|%{content_type}' --max-time 30 https://csoai-site.pages.dev/api/health)
          L=$(curl -sL -o /tmp/api_leaderboard.json -w '%{http_code}|%{content_type}' --max-time 30 https://csoai-site.pages.dev/api/leaderboard)
          echo "csoai-site.pages.dev/api/health     : $H"
          echo "csoai-site.pages.dev/api/leaderboard: $L"
          python3 - <<'PY'
          import json, sys
          d = json.load(open("/tmp/api_health.json"))
          assert d.get("status") == "ok", f"/api/health status != ok: {d.get('status')!r}"
          print(f"OK /api/health: status=ok, pages={d.get('pages')}")
          l = json.load(open("/tmp/api_leaderboard.json"))
          assert isinstance(l, (dict, list)) and l, "/api/leaderboard empty"
          print("OK /api/leaderboard: parsed JSON")
          PY
      - name: ai.txt must be plain text (not SPA shell)
        run: |
          CT=$(curl -sL -o /dev/null -w '%{content_type}' --max-time 30 https://councilof.ai/ai.txt)
          echo "ai.txt: $CT"
